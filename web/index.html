<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- Pinch zoom stays available: capping the scale locks out low-vision users. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09282b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7faf6" media="(prefers-color-scheme: light)" />
    <!--
      The saved theme is applied before the first paint, so a dark-theme visitor does not
      see a white page while the app loads (ThemeProvider keeps it in sync afterwards).
      Until the app's stylesheet arrives the body takes the public home's ground (.lp3 --lp-bg);
      :where() keeps these rules weaker than index.css, which then decides as before.
    -->
    <style>body { background: #f7faf6; } :where(html.dark) body { background: #09282b; } :where(html.dark) { color-scheme: dark; }</style>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('campus-tour-theme') || 'null')
        if (saved && saved.state && saved.state.theme === 'dark') document.documentElement.classList.add('dark')
      } catch (error) { /* private mode or no storage: stay light */ }
    </script>
    <meta name="description" content="Tham quan khuôn viên đại học cùng robot tự hành AMR, trợ lý AI đa ngôn ngữ và bản sao kỹ thuật số theo thời gian thực." />
    <title>CampusTour</title>

    <!--
      Be Vietnam Pro: chosen because every headline on this page carries stacked
      Vietnamese diacritics, and this family draws them without collision at
      tight display leading.
      TODO khi có mạng: self-host bằng `npm i @fontsource-variable/be-vietnam-pro`
      và bỏ thẻ <link> này, để tránh phụ thuộc vào Google Fonts lúc chạy thật.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Largest contentful paint on the landing page is the hero frame. -->
    <link rel="preload" as="image" href="/images/home-3d/hero-smartbus-1600.webp" imagesrcset="/images/home-3d/hero-smartbus-800.webp 800w, /images/home-3d/hero-smartbus-1600.webp 1600w" imagesizes="(max-aspect-ratio: 16/9) 178vh, 100vw" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
