<!doctype html>
<html lang="vi" data-variant="map">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kỹ thuật · Bản đồ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#0f172a;--ink2:#173b59;--text2:#334155;--muted:#64748b;--line:#e2e8f0;--line2:#eef1f4;--soft:#f8fafc;--accent:#2d719e;--accent-ink:#174b70;--accent-soft:#e5f3ff;--accent-soft2:#f1f8fe;--ok:#166534;--ok-soft:#dcfce7;--warn:#92400e;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--radius:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:700}
h3{font-size:14px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.grow{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-danger{color:var(--bad);border-color:#fecaca}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}.btn-danger-solid:hover{background:#991b1b}
.btn-ghost{border-color:transparent;background:transparent}
.btn:disabled{background:#e2e8f0;border-color:#e2e8f0;color:#64748b;cursor:not-allowed}
.btn-sm{min-height:34px;padding:0 10px;font-size:13px}
.icon-btn{width:40px;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));align-items:start}
.g-side{display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}
.page-h{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.page-h .grow{flex:1 1 280px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-info{background:var(--accent-soft);color:var(--accent-ink)}.c-mute{background:#f1f5f9;color:#475569}
.stat .lbl{font-size:12.5px;color:var(--muted)}.stat .val{font-size:24px;font-weight:700;margin-top:4px}.stat .sub{font-size:12.5px;margin-top:2px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--accent-soft2)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]),.field select,.field textarea{min-height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;font-weight:400;background:#fff;font-size:14px;color:var(--ink);width:100%}
.field textarea{min-height:76px;resize:vertical}
.cell{width:100%;min-height:36px;border:1px solid #cbd5e1;border-radius:8px;padding:4px 8px;background:#fff}
.hint{font-size:12px;font-weight:400;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.check.warn{background:#fffbeb;border-color:#fde68a}
.seg{display:inline-flex;background:var(--line2);padding:4px;border-radius:11px;gap:4px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:flex;align-items:center;min-height:36px;padding:0 14px;border-radius:8px;font-weight:600;color:#475569;cursor:pointer;font-size:13px}
.seg input:checked+span{background:#fff;color:var(--accent-ink);box-shadow:0 1px 2px rgba(15,23,42,.1)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res label{position:relative}
.res input{position:absolute;opacity:0;margin:0}
.res span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #cbd5e1;border-radius:10px;font-weight:600;color:#475569;cursor:pointer;background:#fff}
.res input:focus-visible+span{outline:2px solid var(--accent)}
.res input[value=pass]:checked+span{border:2px solid #15803d;background:#f0fdf4;color:var(--ok)}
.res input[value=fail]:checked+span{border:2px solid var(--bad);background:#fef2f2;color:var(--bad)}
.note{padding:12px 14px;border-radius:10px;background:var(--accent-soft2);border:1px solid #d6e8f5;color:var(--accent-ink);font-size:13px}
.note.warn{background:#fffbeb;border-color:#fde68a;color:var(--warn)}
.note.bad{background:#fef2f2;border-color:#fecaca;color:var(--bad)}
.note.ok{background:#f0fdf4;border-color:#bbf7d0;color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px;background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
ul.miss{margin:6px 0 0;padding-left:18px;color:var(--bad);font-size:13px}
.piperow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line2);border-radius:12px}
.piperow.cur{background:var(--accent-soft2);border-color:#d6e8f5}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:1 1 480px}
.step{padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;background:#f1f5f9;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done{background:var(--ok-soft);color:var(--ok)}.step.doing{background:var(--warn-soft);color:var(--warn)}.step.fail{background:var(--bad-soft);color:var(--bad)}
.bar{display:flex;gap:4px}.bar i{flex:1;height:5px;border-radius:3px;background:#e2e8f0}.bar i.done{background:var(--accent)}.bar i.doing{background:#f59e0b}.bar i.fail{background:var(--bad)}
.mapc{position:relative;width:100%;aspect-ratio:40/25;border-radius:12px;background-color:#f8fafc;background-image:linear-gradient(#e2e8f0 1px,transparent 1px),linear-gradient(90deg,#e2e8f0 1px,transparent 1px);background-size:5% 8%;overflow:hidden;border:1px solid var(--line)}
.bld{position:absolute;background:#dbe4ec;border-radius:6px;font-size:11px;color:#475569;padding:6px 8px;font-weight:600;line-height:1.2}
.bld.new{background:#fde7c8;outline:2px dashed #d97706;color:var(--warn)}
.mapc svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.dot i{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(15,23,42,.35);display:block}
.dot.verified i{background:#15803d}.dot.pending i{background:#d97706}.dot.failed i{background:var(--bad)}.dot.preview i{background:#7c3aed}
.dot.sel i{width:20px;height:20px;box-shadow:0 0 0 4px rgba(45,113,158,.35),0 0 0 1.5px #2d719e}
.dot b{position:absolute;top:27px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;background:rgba(255,255,255,.94);padding:1px 6px;border-radius:6px;white-space:nowrap;color:var(--ink)}
.robot{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:6px;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent);z-index:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.col{background:var(--line2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:110px}
.col-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:2px 4px}
.rcard{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.rcard:hover{border-color:var(--accent)}
.rcard.bad{border-color:#fecaca}
.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:22px;text-align:center;background:var(--soft);display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--text2)}
.drop.on{border-color:var(--accent);background:var(--accent-soft2)}
.panel{background:#fff;display:flex;flex-direction:column;min-width:0}
.panel-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel-b{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));background:#fff;border-radius:16px;z-index:50;box-shadow:0 20px 60px rgba(15,23,42,.25);overflow:hidden}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:90vw}
.tl{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.tl:last-child{border-bottom:none}
.tl .when{width:84px;flex:none;color:var(--muted);font-size:12.5px}
.vstep{display:flex;gap:14px;position:relative;padding-bottom:18px}
.vstep .num{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#f1f5f9;color:#475569;z-index:1}
.vstep.done .num{background:var(--ok-soft);color:var(--ok)}.vstep.doing .num{background:var(--warn-soft);color:var(--warn)}.vstep.fail .num{background:var(--bad-soft);color:var(--bad)}
.vstep:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.vstep .vb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.lock{opacity:.5;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.badge{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:auto}
.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;color:var(--ink)}
.task:hover{border-color:#94a3b8}.task.sel{border:2px solid var(--accent);padding:13px 17px}
.task .t1{display:block;font-weight:600}.task .t2{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ti-bad{background:var(--bad-soft);color:var(--bad)}.ti-warn{background:var(--warn-soft);color:var(--warn)}.ti-info{background:var(--accent-soft);color:var(--accent)}
.sec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:6px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;color:var(--text2);font-weight:600;font-size:13px;cursor:pointer}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stops li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px}
.stops .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.avatar{width:34px;height:34px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.item{display:flex;align-items:center;gap:10px;color:#374151;text-decoration:none;font-weight:500;position:relative}
.switch{position:fixed;right:16px;bottom:16px;z-index:25;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;box-shadow:var(--shadow);font-size:12px;font-weight:600;color:var(--muted)}
.switch a{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text2)}
.switch a.on{background:var(--accent);color:#fff}
.mini-steps{display:flex;flex-direction:column;gap:6px}
.mini-steps div{display:flex;align-items:center;gap:8px;font-size:13px}
.mini-steps i{width:18px;height:18px;border-radius:50%;flex:none;background:#e2e8f0}
.mini-steps .done i{background:#15803d}.mini-steps .doing i{background:#f59e0b}.mini-steps .fail i{background:var(--bad)}

/* ── Kiểu 1: Sidebar ─────────────────────────────── */
.v-sidebar .shell{display:flex;min-height:100vh}
.v-sidebar .nav{width:248px;flex:none;background:#fff;border-right:1px solid #e5e7eb;padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.v-sidebar .navlist{display:flex;flex-direction:column;gap:2px}
.v-sidebar .item{padding:10px 12px;border-radius:10px;min-height:44px}
.v-sidebar .item:hover{background:#f3f4f6}
.v-sidebar .item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.v-sidebar .user{margin-top:auto;border-top:1px solid #eceef1;padding:14px 6px 0;display:flex;align-items:center;gap:10px}
.v-sidebar .main{flex:1;min-width:0;padding:28px 36px 80px}
.v-sidebar .panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:45;box-shadow:-10px 0 40px rgba(15,23,42,.15)}

/* ── Kiểu 2: Tab ngang ───────────────────────────── */
.v-topnav .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:20px;padding:0 28px;min-height:64px;flex-wrap:wrap}
.v-topnav .navlist{display:flex;gap:2px;flex-wrap:wrap}
.v-topnav .item{min-height:64px;padding:0 12px;color:var(--muted)}
.v-topnav .item:hover{color:var(--ink)}
.v-topnav .item.on{color:var(--accent-ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.v-topnav .item .badge{margin-left:2px}
.v-topnav .user{display:flex;align-items:center;gap:10px;margin-left:auto}
.v-topnav .body{display:grid;grid-template-columns:minmax(0,1fr);max-width:1480px;margin:0 auto;padding:24px 28px 80px;gap:20px;align-items:start}
.v-topnav .body.has-panel{grid-template-columns:minmax(0,1fr) 420px}
.v-topnav .panel{position:sticky;top:88px;border:1px solid var(--line);border-radius:16px;max-height:calc(100vh - 110px);overflow:hidden}
.wb{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.mcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;width:100%;color:var(--ink)}
.mcard.on{border:2px solid var(--accent);background:var(--accent-soft2);padding:11px 13px}

/* ── Kiểu 3: Hộp việc ────────────────────────────── */
.v-inbox .shell{display:grid;grid-template-columns:80px minmax(0,1fr) 420px;min-height:100vh}
.v-inbox .rail{background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;position:sticky;top:0;height:100vh}
.v-inbox .navlist{display:flex;flex-direction:column;gap:4px;align-items:center}
.v-inbox .item{width:60px;min-height:56px;flex-direction:column;justify-content:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;text-align:center;border-radius:12px;color:#475569}
.v-inbox .item:hover{background:#f3f4f6}
.v-inbox .item.on{background:var(--accent-soft);color:var(--accent-ink)}
.v-inbox .item .badge{position:absolute;top:2px;right:2px;margin:0;padding:0 6px;font-size:10.5px}
.v-inbox .rail .user{margin-top:auto}
.v-inbox .main{padding:28px 32px 80px;min-width:0}
.v-inbox .panel{border-left:1px solid #e5e7eb;position:sticky;top:0;height:100vh}
.v-inbox .switch{left:96px;right:auto}

/* ── Kiểu 4: Bản đồ ──────────────────────────────── */
.v-map{background:#e9eef3}
.v-map .bgmap{position:fixed;inset:0;z-index:0;padding:78px 24px 100px;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.v-map .bgmap .mapc{width:min(100%,calc((100vh - 190px)*1.6));border-radius:18px;box-shadow:0 10px 40px rgba(15,23,42,.08)}
.v-map .bgmap.side{padding-left:372px}
.v-map .bgmap.side .mapc{width:min(100%,calc((100vh - 190px)*1.6))}
.v-map .bgmap.dim{opacity:.35;pointer-events:none;filter:saturate(.6)}
.v-map .topbar{position:fixed;top:14px;left:16px;right:16px;z-index:20;display:flex;gap:10px;align-items:center;pointer-events:none}
.v-map .topbar>*{pointer-events:auto}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;min-height:46px}
.v-map .dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.15);display:flex;padding:6px;max-width:calc(100vw - 24px);overflow-x:auto}
.v-map .navlist{display:flex;gap:4px}
.v-map .item{flex-direction:column;gap:2px;min-width:82px;font-size:12px;padding:8px 10px;justify-content:center;border-radius:12px;color:#475569;font-weight:600}
.v-map .item:hover{background:#f3f4f6}
.v-map .item.on{background:var(--accent);color:#fff}

}

const switcher = () => `<nav class="switch" aria-label="Chọn kiểu bố cục"><span>Kiểu</span>${FILES.map(([v, f], i) => `<a href="${f}" ${v === V ? 'class="on" aria-current="page"' : ''} aria-label="Kiểu ${i + 1}">${i + 1}</a>`).join('')}</nav>`;

function panelView() {

  if (P.type === 'upload') return { title: 'Upload version map', sub: 'Lưu gói map lên portal', body: uploadForm() };

    if (t.kind === 'poi') { const p = poiBy(t.ref); return { title: p.name, sub: `Xác minh POI · ${p.map}`, body: poiForm(p) }; }

function panelAside() {

  if (V === 'inbox') return `<div class="shell"><nav class="rail" aria-label="Điều hướng kỹ thuật"><div class="logo" style="margin-bottom:10px">DT</div><div class="navlist">${navItems(true)}</div>${userBlock(false)}</nav><main class="main">${content}</main>${S.panel ? panelAside() : `<aside class="panel ph"><div class="panel-b" style="justify-content:center;align-items:center;text-align:center;color:var(--muted);gap:10px">${ic('inbox', 30)}<div style="max-width:260px">Chọn một việc hoặc một POI để xem chi tiết và xử lý ngay tại đây.</div></div></aside>`}</div>`;

}

function parseYaml(text) {
  const out = { pois: [] }; let cur = null, inPois = false;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/\s+#.*$/, '').replace(/^#.*$/, ''); if (!line.trim()) return;
    const ind = line.match(/^\s*/)[0].length; let s = line.trim();
    if (ind === 0 && !s.startsWith('-')) { const i = s.indexOf(':'); if (i < 0) return; const k = s.slice(0, i).trim(), v = s.slice(i + 1).trim(); if (k === 'pois') { inPois = true; return; } inPois = false; out[k] = v.replace(/^["']|["']$/g, ''); return; }
    if (!inPois) return;
    if (s.startsWith('-')) { cur = {}; out.pois.push(cur); s = s.slice(1).trim(); }
    if (cur && s.includes(':')) { const i = s.indexOf(':'); cur[s.slice(0, i).trim()] = s.slice(i + 1).trim().replace(/^["']|["']$/g, ''); }
  });
  return out;
}
function validateImport() {
  const map = S.imp.map, existing = new Set(S.pois.filter(p => p.map === map).map(p => p.name.toLowerCase())), seen = new Set(), rows = [];
  S.imp.files.forEach(f => {
    const d = parseYaml(f.text);
    if (!d.pois.length) { rows.push({ file: f.name, name: '—', err: 'Không có mục pois hoặc sai định dạng template' }); return; }
    d.pois.forEach(p => {
      const errs = [], x = parseFloat(p.x), y = parseFloat(p.y), yaw = parseFloat(p.yaw);
      if (d.map !== map) errs.push(`File ghi map "${d.map || 'trống'}", khác ${map}`);
      if (!p.name) errs.push('Thiếu name');
      const fr = p.frame || d.frame || ''; if (fr !== 'map') errs.push(`frame phải là "map" (đang là "${fr || 'trống'}")`);
      if ([x, y, yaw].some(Number.isNaN)) errs.push('x, y, yaw phải là số');
      else { if (x < 0 || x > 40 || y < 0 || y > 25) errs.push('Tọa độ nằm ngoài bản đồ (40 × 25 m)'); if (Math.abs(yaw) > 3.1416) errs.push('yaw ngoài khoảng ±π'); }
      const key = (p.name || '').toLowerCase();
      if (existing.has(key)) errs.push('Trùng tên POI đã có trên map'); else if (seen.has(key)) errs.push('Trùng tên giữa các file');
      seen.add(key);
      rows.push({ file: f.name, name: p.name || '—', x, y, yaw, err: errs.join(' · ') });
    });
  });
  return rows;
}

async function sha(file) {
  try { const h = await crypto.subtle.digest('SHA-256', await file.arrayBuffer()); const hex = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); return hex.slice(0, 8) + '…' + hex.slice(-4); }
  catch (e) { return Math.random().toString(16).slice(2, 10) + '…' + Math.random().toString(16).slice(2, 6); }
}
function patchUpload() { const el = $('#upsum'); if (el) el.innerHTML = upSummary(); const b = $('form[data-form=upload] [type=submit]'); if (b) b.disabled = !S.up; }
async function takePkg(file) {
  if (!/\.zip$/i.test(file.name)) { toast('Chỉ nhận gói .zip'); return; }
  S.up = { file: file.name, size: (file.size / 1048576).toFixed(1) + ' MB', checksum: await sha(file), res: 0.05, origin: '[-2.0, -3.0, 0]' }; patchUpload();
}
function takeYaml(files) {
  const list = [...files].filter(f => /\.ya?ml$/i.test(f.name));
  if (!list.length) { toast('Chỉ nhận file .yaml hoặc .yml'); return; }
  Promise.all(list.map(f => f.text().then(text => ({ name: f.name, text })))).then(arr => { S.imp.files.push(...arr); render(); });
}

document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || !ACT[a.dataset.act]) return; e.preventDefault(); ACT[a.dataset.act](a.dataset, a); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change && CHG[el.dataset.change]) CHG[el.dataset.change](el); const f = el.closest('form[data-live]'); if (f && LIVE[f.dataset.form]) LIVE[f.dataset.form](f); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORM[f.dataset.form](f, new FormData(f)); });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (S.modal) { S.modal = null; render(); } else if (S.panel) closePanel(); });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('on'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('on'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('on'); const fs = e.dataTransfer.files; if (!fs.length) return; if (z.dataset.drop === 'pkg') takePkg(fs[0]); else takeYaml(fs); });
window.addEventListener('hashchange', () => { S.panel = null; S.sel.poi = null; S.sel.task = null; S.modal = null; render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
