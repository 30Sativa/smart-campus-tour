<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 role · bản thiết kế</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--navy:#173b59;--primary:#2d719e;--primary-deep:#245e84;--wash:#e5f3ff;--wash-2:#f1f8fe;--ground:#f6f7f9;--line:#e2e8f0;--line-soft:#eef1f4;--muted:#64748b;--text-2:#334155;--ok:#1f7a55;--ok-bg:#effbf5;--warn:#8a5a06;--warn-bg:#fff8e6;--bad:#b23e31;--bad-bg:#fff1ef;--mapbg:#e2eaf2}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--ground);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--primary)}h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.shell{display:flex;min-height:100vh}
/* sidebar A */
.side{width:236px;flex:none;background:#fff;box-shadow:1px 0 0 #eceef1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;flex:none;text-decoration:none;color:var(--ink);cursor:pointer;border:none;background:none;text-align:left}
.brand .mark{width:32px;height:32px;flex:none;border-radius:10px;background:#fff;box-shadow:0 0 0 1px #e5e7eb,0 6px 14px -8px rgba(17,24,39,.35);display:grid;place-items:center}
.brand .mark img{width:25px;height:25px;object-fit:contain}
.brand b{display:block;font-size:14px;letter-spacing:-.03em}.brand small{display:block;font-size:11px;color:#6b7280;font-weight:600}
.livecard{margin:2px 10px 4px;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--navy);color:#fff;border:none;cursor:pointer;text-align:left;width:calc(100% - 20px)}
.livecard:hover{background:#1f4b70}
.livecard i{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.livecard b{display:block;font-size:12.5px}.livecard small{font-size:11px;opacity:.85}
.navs{flex:1;overflow-y:auto;padding:0 10px 10px;scrollbar-width:thin}
.grp{font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 10px 3px;border-top:1px solid var(--line-soft);margin-top:4px}
.grp:first-child{border-top:none;margin-top:0}
.it{display:flex;align-items:center;gap:10px;width:100%;min-height:30px;padding:0 10px;border:none;background:none;border-radius:8px;color:#374151;cursor:pointer;text-align:left;white-space:nowrap}
.it svg{flex:none;color:#6b7280}
.it:hover{background:#f3f4f6;color:var(--ink)}
.it[aria-current]{background:var(--wash-2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.it[aria-current] svg{color:var(--primary)}
.it .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.n{min-width:20px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--primary);padding:0 6px}
.n.r{background:#dc2626}
.foot{flex:none;border-top:1px solid #eceef1;padding:8px 12px}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;height:52px;display:flex;align-items:center;gap:10px;padding:0 24px;background:rgba(246,247,249,.9);backdrop-filter:blur(6px);border-bottom:1px solid #e5e7eb}
.crumb{font-size:12.5px;color:#9ca3af}.crumb b{color:#6b7280;font-weight:500}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:#ecfdf3;color:#15803d}
.conn i{width:7px;height:7px;border-radius:50%;background:#16a34a}
.acct{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}
.acct .av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.acct b{display:block;font-size:12.5px}.acct span{color:var(--muted);font-size:11px}
.bell{width:32px;height:32px;border-radius:9px;border:none;background:none;display:grid;place-items:center;color:#64748b;position:relative;cursor:pointer}
.bell i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#dc2626;box-shadow:0 0 0 2px #f6f7f9}
.main{padding:16px 24px 40px;max-width:1400px;width:100%}

/* page parts */
.top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top .g{flex:1 1 360px}.top h1{font-size:21px;font-weight:700;letter-spacing:-.025em;color:var(--navy);line-height:1.2}
.top p{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:80ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border-radius:9px;border:1px solid #d9e9f5;background:#fff;color:#285c7d;font-weight:600;font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--wash-2)}.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}.btn.p:hover{background:var(--primary-deep)}
.btn.s{min-height:28px;padding:0 9px;font-size:12px;border-radius:8px}
.btn.danger{border-color:#f5c8c2;background:var(--bad-bg);color:var(--bad)}
.btn:disabled{background:#e3edf4;border-color:#e3edf4;color:#64748b;cursor:not-allowed}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid;white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg);border-color:#cde9dc}.st.warn{color:var(--warn);background:var(--warn-bg);border-color:#f0d89f}.st.bad{color:var(--bad);background:var(--bad-bg);border-color:#f5c8c2}.st.mute{color:#5d7085;background:#f6f9fd;border-color:#dbe6f4}.st.run{color:#fff;background:var(--primary);border-color:var(--primary)}.st.info{color:#2f62b8;background:#eef5ff;border-color:#cfe1fb}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line-soft)}
.ph h2{font-size:13px;font-weight:600}.ph a,.ph .lnk{font-size:12px;font-weight:600;text-decoration:none;color:var(--primary);background:none;border:none;cursor:pointer}
.ph small{font-size:11.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line-soft)}
.list li:first-child{border-top:none}.list .g{flex:1;min-width:0}.list small{display:block;color:var(--muted);font-size:11.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.kpi{padding:10px 14px;border-left:1px solid var(--line-soft);min-width:0;background:none;border-top:none;border-right:none;border-bottom:none;text-align:left;cursor:default}
.kpi:first-child{border-left:none}
button.kpi{cursor:pointer}button.kpi:hover{background:#fafcfe}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}.kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3}.kpi i{font-style:normal;font-size:11.5px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:12px;align-items:start}
.stack{display:grid;gap:12px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:7px 12px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#fafcfe}
.t small{display:block;color:var(--muted);font-size:11.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid #d9e9f5;border-radius:9px;background:#fff;min-width:220px;color:var(--muted)}
.search input{border:none;outline:none;flex:1;min-width:0;font-size:12.5px;background:none;color:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pager{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.pager .pg{display:flex;gap:4px}.pager .pg button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px}
.pager .pg button[aria-current]{background:var(--navy);color:#fff;border-color:var(--navy)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:0;padding:10px 14px}.facts dt{color:var(--muted)}.facts dd{margin:0;text-align:right;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.field input,.field select,.field textarea{min-height:36px;border:1px solid #d9e9f5;border-radius:9px;padding:6px 10px;background:#fff;font-size:13px;font-weight:400;color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.hint{font-size:11.5px;color:var(--muted);font-weight:400}
.note{padding:9px 12px;border-radius:9px;font-size:12.5px;background:var(--wash-2);border:1px solid #d6e8f5;color:#174b70}
.note.warn{background:#fffbeb;border-color:#fde68a;color:var(--warn)}.note.bad{background:var(--bad-bg);border-color:#f5c8c2;color:var(--bad)}.note.ok{background:var(--ok-bg);border-color:#cde9dc;color:var(--ok)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:none;background:none;padding:8px 12px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;box-shadow:inset 0 -2px 0 transparent}
.tabs button[aria-selected=true]{color:var(--navy);box-shadow:inset 0 -2px 0 var(--primary)}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);padding:0 8px}
.ptabs button{border:none;background:none;padding:8px 10px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;box-shadow:inset 0 -2px 0 transparent}
.ptabs button[aria-selected=true]{color:var(--navy);box-shadow:inset 0 -2px 0 var(--primary)}
.mapbox{background:var(--mapbg);display:flex;justify-content:center}
.mapbox svg{display:block;width:100%;height:auto}
/* day strip */
.day{padding:10px 14px 12px}
.axis{position:relative;height:18px;margin-left:140px;font-size:11px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.lane{display:grid;grid-template-columns:140px minmax(0,1fr);align-items:center;min-height:38px;border-top:1px solid var(--line-soft)}
.lane .w{font-size:12px;padding-right:10px}.lane .w b{display:block;font-size:12.5px}.lane .w small{color:var(--muted)}
.track{position:relative;height:38px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/9 - 1px),var(--line-soft) calc(100%/9 - 1px) calc(100%/9))}
.bar{position:absolute;top:8px;height:22px;border-radius:7px;display:flex;overflow:hidden;cursor:pointer;border:none;padding:0}
.bar .buf{width:var(--b);background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}
.bar .run{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden}
.bar.running{background:var(--primary);color:#fff}.bar.ready{background:#b9dcf2;color:var(--navy)}.bar.sched{background:#e2e8f0;color:var(--text-2)}.bar.blocked{background:#f9d6d1;color:var(--bad)}.bar.done{background:#cfe9dc;color:var(--ok)}
.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);z-index:2}
.now::before{content:attr(data-t);position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--bad);background:#fff;padding:0 3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:0 14px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:16px;height:8px;border-radius:3px;display:inline-block}
/* live (mẫu A) */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.strip div{padding:7px 12px;border-left:1px solid var(--line-soft);min-width:0}.strip div:first-child{border-left:none}
.strip small{display:block;font-size:11px;color:var(--muted)}.strip b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.strip i{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schem{display:flex;padding:14px 16px 10px;overflow-x:auto}
.schem div{flex:1;min-width:110px;position:relative}
.schem div::after{content:"";position:absolute;top:15px;left:34px;right:0;height:3px;background:#c9dfee}
.schem div.d::after{background:#7db9db}.schem div:last-child::after{display:none}
.schem span.nn{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#d5eaf8;color:#3d789d;border:4px solid #fff}
.schem .d span.nn{background:#aadcf6;color:#285c7d}.schem .c span.nn{background:#347ea9;color:#fff}
.schem b{display:block;font-size:12px;margin-top:4px;color:#527b98}.schem .c b{color:#28739f}
.schem small{font-size:10.5px;color:#8a9fb0}
.stops{list-style:none;margin:0;padding:0}
.stops li{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;border-top:1px solid var(--line-soft)}
.stops li:first-child{border-top:none}
.stops .mk{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:2px solid #d5dfec;color:#8a98ac;background:#fff}
.stops .d .mk{background:#2f8f6b;border-color:#2f8f6b;color:#fff}
.stops .c .mk{background:#5b91ed;border-color:#5b91ed;color:#fff;box-shadow:0 0 0 4px rgba(91,145,237,.2)}
.stops .c{background:var(--wash-2)}
.stops b{display:block;font-size:12.5px;font-weight:600}.stops small{color:var(--muted);font-size:11px}
.hs{display:inline-flex;gap:3px;margin-left:4px}.hs i{font-style:normal;font-size:9.5px;font-weight:700;background:#f1f5fb;color:#647793;border-radius:4px;padding:0 4px}
.big{min-height:52px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer}
.big.next{background:var(--primary);color:#fff}.big.hold{background:#fff;border:2px solid var(--navy);color:var(--navy)}
.end{width:100%;min-height:36px;border-radius:10px;border:1px solid #f5c8c2;background:var(--bad-bg);color:var(--bad);font-weight:600;cursor:pointer}
.small{font-size:11px;color:var(--muted);line-height:1.35}
.log{list-style:none;margin:0;padding:6px}
.log li{display:flex;gap:10px;padding:5px 8px;border-radius:7px;font-size:11.5px;background:#f8fafc}
.log li+li{margin-top:3px}.log time{width:38px;flex:none;font-weight:700;color:var(--muted)}
/* checks */
.cond{list-style:none;margin:0;padding:0}
.cond li{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--line-soft)}
.cond li:first-child{border-top:none}
.cond .ic{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px;color:#fff;font-size:11px;font-weight:700}
.cond .ok .ic{background:var(--ok)}.cond .no .ic{background:var(--bad)}.cond .wait .ic{background:#d69412}
.cond .g{flex:1}.cond b{display:block;font-weight:600}.cond small{color:var(--muted);font-size:11.5px}
.ck{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;background:#fff}
.ck input{width:16px;height:16px;accent-color:var(--primary)}
/* robot cards */
.devs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.meter{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--ok)}
/* charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding:12px 14px 4px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted)}
.bars span{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:#b9dcf2}
.bars span.today{background:var(--primary)}
.bars span.x{background:#f9d6d1}
/* review */
.rv{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;align-items:start}
.queue > button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:9px 14px;cursor:pointer;border-top:1px solid var(--line-soft)}
.queue > button:hover{background:#fafcfe}.queue > button[aria-pressed=true]{background:var(--wash-2);box-shadow:inset 3px 0 0 var(--primary)}
.queue .g{flex:1;min-width:0}.queue b{display:block;font-weight:600}.queue small{color:var(--muted);font-size:11.5px}
.age{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--line-soft);color:var(--text-2)}.age.late{background:var(--bad-bg);color:var(--bad)}
.foot2{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line-soft)}
/* intercom */
.talk{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 16px}
.talk button.ptt{width:150px;height:150px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 0 0 10px var(--wash)}
.talk button.ptt[aria-pressed=true]{background:var(--bad);box-shadow:0 0 0 10px var(--bad-bg)}
/* create */
.steps3{display:flex;gap:6px;margin-bottom:12px}
.steps3 span{flex:1;padding:7px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.steps3 span.on{border-color:var(--primary);color:var(--navy);font-weight:600;background:var(--wash-2)}
.steps3 span.d{color:var(--ok)}
.routepick{display:grid;gap:8px}
.routepick label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.routepick label:has(input:checked){border-color:var(--primary);background:var(--wash-2)}
.routepick label.off{opacity:.6;cursor:not-allowed}
.wbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:8px 0 4px;font-size:11px;font-weight:600}
.wbar span{display:flex;align-items:center;justify-content:center}
.wscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:10px 12px}
.cal div{min-height:84px;border:1px solid var(--line-soft);border-radius:9px;padding:6px;font-size:11px}
.cal div.today{border-color:var(--primary);background:var(--wash-2)}
.cal div b{display:block;font-size:12px;margin-bottom:4px}
.cal div span{display:block;border-radius:5px;padding:1px 5px;margin-top:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view[hidden]{display:none}
@media (max-width:1100px){.livegrid{grid-template-columns:minmax(0,1fr)!important}.g2,.g21,.rv{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.shell{flex-direction:column}.side{width:auto;height:auto;position:static}.navs{display:flex;overflow-x:auto;gap:4px;padding:4px 10px}.grp{display:none}.it{width:auto}.foot{display:none}.main{padding:12px}.topbar{padding:0 12px}.acct div{display:none}.axis{margin-left:90px}.lane{grid-template-columns:90px minmax(0,1fr)}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.cal{grid-template-columns:repeat(2,minmax(0,1fr))}.f3{grid-template-columns:minmax(0,1fr)!important}.steps3{flex-direction:column}.routepick label{flex-wrap:wrap}.search{min-width:0;flex:1}}
.livecard[hidden]{display:none}
.mapbox svg{max-height:560px}
/* role switch (preview only) */
.roleswitch{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 10px;box-shadow:0 6px 18px -10px rgba(15,23,42,.35);font-size:11.5px;color:var(--muted)}
.roleswitch button{border:none;background:none;border-radius:9px;padding:5px 12px;font-weight:600;font-size:12.5px;color:var(--text-2);cursor:pointer}
.roleswitch button[aria-pressed=true]{background:var(--navy);color:#fff}
/* page transition: one sweep + content rise */
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--primary);z-index:60;opacity:0}
#progress.run{animation:sweep .5s cubic-bezier(.22,1,.36,1)}
@keyframes sweep{0%{width:0;opacity:1}70%{width:85%;opacity:1}100%{width:100%;opacity:0}}
.main.enter{animation:rise .32s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.it{transition:background-color .15s,color .15s,box-shadow .2s}
/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 24px))}
.toast{position:relative;overflow:hidden;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px 13px;box-shadow:0 14px 34px -14px rgba(15,23,42,.35);animation:tin .28s cubic-bezier(.22,1,.36,1)}
.toast.out{animation:tout .2s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(16px)}}
.toast .ti{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.toast.ok .ti{background:var(--ok)}.toast.info .ti{background:var(--primary)}.toast.error .ti{background:var(--bad)}
.toast .tb{flex:1;min-width:0}.toast .tb b{display:block;font-size:13px}.toast .tb span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.toast .ta{margin-top:6px;border:none;background:none;padding:0;font-weight:600;font-size:12px;color:var(--primary);cursor:pointer}
.toast .tx{border:none;background:none;color:#94a3b8;cursor:pointer;padding:2px;border-radius:6px}.toast .tx:hover{background:#f1f5f9;color:var(--ink)}
.toast .tp{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left;animation:shrink var(--d,5000ms) linear forwards}
.toast.ok .tp{background:var(--ok)}.toast.info .tp{background:var(--primary)}.toast.error .tp{background:var(--bad)}
.toast.paused .tp{animation-play-state:paused}
@keyframes shrink{to{transform:scaleX(0)}}
/* overlay: dialog + drawer */
#overlay{position:fixed;inset:0;z-index:65}
#overlay .scrim{position:absolute;inset:0;background:rgba(15,23,42,.28);backdrop-filter:blur(2px);opacity:0;transition:opacity .2s}
#overlay.on .scrim{opacity:1}
.dialog{position:absolute;left:50%;top:50%;width:min(460px,calc(100vw - 24px));background:#fff;border-radius:16px;padding:18px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .24s cubic-bezier(.22,1,.36,1),opacity .2s;box-shadow:0 24px 60px -20px rgba(15,23,42,.45)}
#overlay.on .dialog{transform:translate(-50%,-50%);opacity:1}
.dialog h2{font-size:16px;color:var(--navy)}.dialog p{font-size:12.5px;color:var(--text-2);margin-top:6px}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:-20px 0 50px -20px rgba(15,23,42,.35)}
#overlay.on .drawer{transform:none}
.drawer .dh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.drawer .dh h2{font-size:16px;color:var(--navy)}.drawer .dh p{font-size:12px;color:var(--muted);margin-top:2px}
.drawer .db{flex:1;overflow-y:auto;padding:14px 18px;display:grid;gap:10px;align-content:start}
.btn.dangerSolid{background:var(--bad);border-color:var(--bad);color:#fff}
/* technical/admin bits */
.kp5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi.okk b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:2px}
.kpi.okk b{font-size:16px}
.alertrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--bad-bg);border:1px solid #f5c8c2;font-size:12.5px;margin-bottom:12px}
.alertrow b{color:var(--bad)}.alertrow .btn{margin-left:auto}
.board3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.board3 > div{padding:8px 12px;border-left:1px solid var(--line-soft)}.board3 > div:first-child{border-left:none}
.board3 h3{font-size:12px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:4px}
.board3 .c-bad{color:var(--bad)}.board3 .c-warn{color:var(--warn)}.board3 .c-ok{color:var(--ok)}
.board3 button{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 0;border-top:1px solid var(--line-soft);cursor:pointer}
.board3 button:hover b{color:var(--primary)}
.board3 b{display:block;font-size:12.5px}.board3 small{display:block;color:var(--muted);font-size:11px}
.evid{list-style:none;margin:0;padding:0}
.evid li{position:relative;padding:0 0 14px 30px}
.evid li::before{content:"";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:#f1f5f9;border:2px solid var(--line)}
.evid li.d::before{background:var(--ok);border-color:var(--ok)}.evid li.w::before{background:var(--warn-bg);border-color:#d69412}
.evid li::after{content:"";position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--line)}
.evid li:last-child::after{display:none}
.mk2{width:22px;height:22px;border-radius:50%;background:var(--wash);color:var(--navy);font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.res2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res2 label{position:relative}.res2 input{position:absolute;opacity:0}
.res2 span{display:flex;align-items:center;justify-content:center;min-height:38px;border:1px solid #cbd5e1;border-radius:10px;font-weight:600;cursor:pointer;color:#475569}
.res2 label:first-child input:checked+span{border:2px solid var(--ok);background:var(--ok-bg);color:var(--ok)}
.res2 label:last-child input:checked+span{border:2px solid var(--bad);background:var(--bad-bg);color:var(--bad)}
.yes{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:reduce){.main.enter,#progress.run,.toast,.toast.out,.toast .tp{animation:none!important}.dialog,.drawer,#overlay .scrim{transition:none!important}}
@media (max-width:1100px){.kp5{grid-template-columns:repeat(2,minmax(0,1fr))}.board3{grid-template-columns:minmax(0,1fr)}.board3>div{border-left:none;border-top:1px solid var(--line-soft)}}
@media (max-width:820px){.roleswitch{top:auto;bottom:10px}#toasts{bottom:60px}}

</style>

/* ── Thông báo ── */
function toast(kind, title, detail = '', action) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  el.innerHTML = `<span class="ti">${ic(kind === 'ok' ? 'ok' : kind === 'error' ? 'alert' : 'info', 15)}</span><div class="tb"><b>${title}</b>${detail ? `<span>${detail}</span>` : ''}${action ? `<button class="ta" data-go="${action[1]}">${action[0]}</button>` : ''}</div><button class="tx" aria-label="Đóng thông báo">${ic('x', 14)}</button><i class="tp"></i>`;
  box.appendChild(el);
  let left = 5000, t0 = Date.now(), timer;
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  const run = () => { t0 = Date.now(); el.style.setProperty('--d', left + 'ms'); el.classList.remove('paused'); timer = setTimeout(close, left); };
  el.addEventListener('mouseenter', () => { clearTimeout(timer); left -= Date.now() - t0; el.classList.add('paused'); });
  el.addEventListener('mouseleave', run);
  el.querySelector('.tx').addEventListener('click', close);
  el.querySelector('.ta')?.addEventListener('click', close);
  run();
}

/* ── Hộp xác nhận & ngăn kéo ── */
function confirmBox({ title, desc, label, danger, reason, onOk }) {
  const o = document.getElementById('overlay');
  o.innerHTML = `<div class="scrim" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><p>${desc}</p>${reason ? `<label class="field" style="margin-top:10px">${reason}<textarea id="rsn" placeholder="Ghi lại để đồng nghiệp và nhật ký hiểu vì sao…"></textarea></label>` : ''}<div class="foot2" style="padding:12px 0 0;border:none"><button class="btn" data-close>Hủy</button><button class="btn ${danger ? 'dangerSolid' : 'p'}" id="okb" ${reason ? 'disabled' : ''}>${label}</button></div></div>`;
  o.hidden = false; requestAnimationFrame(() => o.classList.add('on'));
  const ok = o.querySelector('#okb'); const r = o.querySelector('#rsn');
  r?.addEventListener('input', () => { ok.disabled = !r.value.trim(); }); (r || ok).focus();
  ok.addEventListener('click', () => { closeOverlay(); onOk(); });
}

function openDrawer(k) {
  const [t, d, body, label, done] = DRAWERS[k]; const o = document.getElementById('overlay');
  o.innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${t}"><div class="dh"><div><h2>${t}</h2><p>${d}</p></div><button class="bell" data-close aria-label="Đóng">${ic('x', 16)}</button></div><div class="db">${body}</div><div class="foot2"><button class="btn" data-close>Hủy</button><button class="btn p" id="dok">${label}</button></div></aside>`;
  o.hidden = false; requestAnimationFrame(() => o.classList.add('on')); o.querySelector('#dok').focus();
  o.querySelector('#dok').addEventListener('click', () => { closeOverlay(); done(); });
}
function closeOverlay() { const o = document.getElementById('overlay'); o.classList.remove('on'); setTimeout(() => { o.hidden = true; o.innerHTML = ''; }, 200); }

/* ── Khung theo role, chuyển trang ── */
function nav() {
  const owner = OWNER[cur] || cur;
  document.getElementById('nav').innerHTML = ROLE[role].groups.map(([g, items]) => `<div class="grp">${g}</div>${items.map((k) => { const [n, icon] = PAGES[k]; const b = BADGE[k]; return `<button class="it" data-go="${k}" ${k === owner ? 'aria-current="page"' : ''}>${ic(icon)}<span class="lb">${n}</span>${b ? `<span class="n ${b[1]}">${b[0]}</span>` : ''}</button>`; }).join('')}`).join('');
}
function show(p) {
  if (!P[p]) return;
  cur = p; nav();
  document.getElementById('crumb').textContent = PAGES[p][0];
  const m = document.getElementById('main');
  const bar = document.getElementById('progress'); bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');
  m.classList.remove('enter'); void m.offsetWidth;
  m.innerHTML = P[p](); m.classList.add('enter');
  window.scrollTo(0, 0);
}
function setRole(r) {
  role = r; const R = ROLE[r];
  document.querySelectorAll('[data-role]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.role === r));
  document.querySelector('.brand small').textContent = R.sub;
  document.querySelector('.brand').dataset.go = R.home;
  document.querySelector('.livecard').hidden = !R.live;
  const [av, u, rl] = R.user; document.querySelector('.acct .av').textContent = av; document.querySelector('.acct b').textContent = u; document.querySelector('.acct div span').textContent = rl;
  show(R.home);
}
document.addEventListener('click', (e) => {
  const r = e.target.closest('[data-role]'); if (r) return setRole(r.dataset.role);
  if (e.target.closest('[data-close]')) return closeOverlay();
  const d = e.target.closest('[data-drawer]'); if (d) return openDrawer(d.dataset.drawer);
  const a = e.target.closest('[data-act]'); if (a) return DATA_ACT[a.dataset.act](a);
  const b = e.target.closest('button'); if (!b || b.closest('[data-go],[data-rv],.chips,[role=tablist],.toast')) return;
  const fn = ACT[b.textContent.trim()]; if (fn) fn();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('overlay').hidden) closeOverlay(); });
