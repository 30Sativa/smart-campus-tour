const pathOf = (keys) => { const path = new THREE.CurvePath(); for (let i = 1; i < keys.length; i++) path.add(new THREE.LineCurve3(v3(keys[i - 1]), v3(keys[i]))); return path; };
function neon(keys, color, r) { const g = new THREE.Group(), path = pathOf(keys), seg = keys.length * 24; g.add(new THREE.Mesh(new THREE.TubeGeometry(path, seg, r, 8, false), new THREE.MeshBasicMaterial({ color }))); g.add(new THREE.Mesh(new THREE.TubeGeometry(path, seg, r * 3.2, 8, false), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .13, depthWrite: false }))); return g; }
function dots(keys, color) { const g = new THREE.Group(), m = new THREE.MeshBasicMaterial({ color }); for (let i = 1; i < keys.length; i++) { const a = v3(keys[i - 1], .22), b = v3(keys[i], .22), n = Math.ceil(a.distanceTo(b) / .7); for (let j = 0; j <= n; j++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.15, 10, 8), m); s.position.lerpVectors(a, b, j / n); g.add(s); } } return g; }
let routeKey = '', routeObj = null, doneObj = null, prevKey = '', prevObj = null;
const markers = {};
Object.keys(P).forEach((k) => { const g = new THREE.Group(); const base = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, .14, 28), new THREE.MeshStandardMaterial({ color: 0x0e1f33 })); base.position.y = .07; g.add(base); const ring = new THREE.Mesh(new THREE.TorusGeometry(.62, .09, 8, 32), new THREE.MeshBasicMaterial({ color: 0x22d3ee })); ring.rotation.x = Math.PI / 2; ring.position.y = .18; g.add(ring); if (P[k].branch) { const d = new THREE.Mesh(new THREE.OctahedronGeometry(.42), new THREE.MeshBasicMaterial({ color: 0x34d399, wireframe: true })); d.position.y = 1.5; d.name = 'diamond'; g.add(d); } g.position.set(P[k].x, 0, P[k].z); scene.add(g); markers[k] = { g, ring };
  const el = document.createElement('div'); el.className = 'absolute -translate-x-1/2 -translate-y-full whitespace-nowrap rounded-md border border-accent/25 bg-deep/85 px-1.5 py-0.5 text-[11px] font-semibold text-fg backdrop-blur'; el.textContent = P[k].n; labels.appendChild(el); markers[k].el = el; });

const robot = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8f6ff, roughness: .35, metalness: .2, transparent: true }), darkMat = new THREE.MeshStandardMaterial({ color: 0x0e1f33, transparent: true }), glowMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true });
const body = new THREE.Mesh(new THREE.CylinderGeometry(.75, .85, 1, 32), bodyMat); body.position.y = .55; robot.add(body);
const band = new THREE.Mesh(new THREE.CylinderGeometry(.78, .78, .12, 32), glowMat); band.position.y = .82; robot.add(band);
const head = new THREE.Mesh(new THREE.SphereGeometry(.4, 24, 16), darkMat); head.position.y = 1.35; robot.add(head);
const eye = new THREE.Mesh(new THREE.BoxGeometry(.42, .08, .1), glowMat); eye.position.set(0, 1.4, .36); robot.add(eye);
const nose = new THREE.Mesh(new THREE.ConeGeometry(.2, .45, 16), glowMat); nose.rotation.x = Math.PI / 2; nose.position.set(0, .55, .95); robot.add(nose);
const pulse = new THREE.Mesh(new THREE.RingGeometry(.95, 1.12, 48), new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, side: THREE.DoubleSide, depthWrite: false })); pulse.rotation.x = -Math.PI / 2; pulse.position.y = .03; robot.add(pulse);
const unc = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: .2, depthWrite: false })); unc.rotation.x = -Math.PI / 2; unc.position.y = .04; scene.add(unc);
const uncRing = new THREE.Mesh(new THREE.RingGeometry(.97, 1, 64), new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: .8, depthWrite: false })); uncRing.rotation.x = -Math.PI / 2; uncRing.position.y = .05; scene.add(uncRing);
scene.add(robot);
const rLabel = document.createElement('div'); labels.appendChild(rLabel);

const cam = { theta: .55, phi: .95, r: 40, tx: 0, tz: 1, mode: 'overview' };
const PRESETS = { overview: { theta: .55, phi: .95, r: 40 }, top: { theta: 0, phi: .02, r: 44 }, follow: { theta: .7, phi: .85, r: 17 } };
window.TWIN = { cam(m) { cam.mode = m; Object.assign(cam, PRESETS[m]); if (m !== 'follow') { cam.tx = 0; cam.tz = 1; } } };
document.querySelector('[data-cam=overview]').setAttribute('aria-pressed', 'true');
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, t: cam.theta, p: cam.phi }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => { if (!drag) return; cam.theta = drag.t - (e.clientX - drag.x) * .006; cam.phi = Math.min(1.45, Math.max(.02, drag.p - (e.clientY - drag.y) * .006)); });
renderer.domElement.addEventListener('pointerup', () => (drag = null));
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); cam.r = Math.min(80, Math.max(9, cam.r * (1 + Math.sign(e.deltaY) * .08))); }, { passive: false });
function resize() { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host); addEventListener('resize', resize); resize();
const tmp = new THREE.Vector3();
function place(el, pos, yOff = 0) { tmp.copy(pos); tmp.y += yOff; tmp.project(camera); const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1; el.style.display = vis ? '' : 'none'; el.style.left = `${(tmp.x * .5 + .5) * host.clientWidth}px`; el.style.top = `${(-tmp.y * .5 + .5) * host.clientHeight}px`; }

function frame(t) {
  const early = APP.state === 'Completed' && APP.endReason;
  const rk = `${APP.route}:${APP.idx}:${APP.state}:${!!APP.assist}`;
  if (rk !== routeKey) { routeKey = rk; [routeObj, doneObj].forEach((o) => o && scene.remove(o)); const keys = ROUTES[APP.route]; routeObj = neon(keys, 0x22d3ee, .11); scene.add(routeObj); const n = APP.state === 'Completed' && !early ? keys.length : APP.idx; doneObj = n > 1 ? neon(keys.slice(0, n), 0x4ade80, .14) : null; doneObj && scene.add(doneObj);
    Object.entries(markers).forEach(([k, m]) => { const on = keys.includes(k), i = keys.indexOf(k); m.g.scale.setScalar(on ? 1 : .7); m.ring.material.color.setHex(!on ? 0x35506b : i < APP.idx || (APP.state === 'Completed' && !early) ? 0x4ade80 : i === APP.idx ? (APP.assist ? 0xff6b6b : 0xffffff) : 0x22d3ee); m.el.style.opacity = on ? 1 : .5; }); }
  const pk = APP.preview || ''; if (pk !== prevKey) { prevKey = pk; prevObj && scene.remove(prevObj); prevObj = pk ? dots(ROUTES[pk].slice(ROUTES[pk].indexOf('rb')), 0x34d399) : null; prevObj && scene.add(prevObj); }
  robot.position.set(APP.robot.x, 0, APP.robot.z); robot.rotation.y += ((APP.robot.h || 0) - robot.rotation.y) * .12;
  const stale = APP.stale, col = APP.assist ? 0xff6b6b : 0x22d3ee; [bodyMat, darkMat, glowMat].forEach((m) => (m.opacity = stale ? .35 : 1)); glowMat.color.setHex(col);
  const ph = (t / 900) % 1; pulse.scale.setScalar(stale ? 1 : 1 + ph * 1.1); pulse.material.opacity = stale ? 0 : .9 - ph * .9; pulse.material.color.setHex(col);
  unc.visible = uncRing.visible = stale; if (stale) { const s = Math.min(1.2 + (Date.now() - APP.staleSince) / 1000 * .12, 6); unc.scale.setScalar(s); uncRing.scale.setScalar(s); unc.position.set(APP.robot.x, .04, APP.robot.z); uncRing.position.set(APP.robot.x, .05, APP.robot.z); }
  Object.values(markers).forEach((m) => { const d = m.g.getObjectByName('diamond'); if (d) { d.rotation.y = t / 700; d.position.y = 1.5 + Math.sin(t / 400) * .12; } });
  if (cam.mode === 'follow') { cam.tx += (APP.robot.x - cam.tx) * .08; cam.tz += (APP.robot.z - cam.tz) * .08; }
  camera.position.set(cam.tx + cam.r * Math.sin(cam.phi) * Math.sin(cam.theta), cam.r * Math.cos(cam.phi), cam.tz + cam.r * Math.sin(cam.phi) * Math.cos(cam.theta)); camera.lookAt(cam.tx, 0, cam.tz);
  renderer.render(scene, camera);
  Object.values(markers).forEach((m) => { place(m.el, m.g.position, 1.1); if (Math.hypot(m.g.position.x - robot.position.x, m.g.position.z - robot.position.z) < 1.6) m.el.style.display = 'none'; });
  rLabel.className = `absolute -translate-x-1/2 -translate-y-full whitespace-nowrap rounded-full border px-2 py-0.5 font-mono text-[11px] font-bold ${stale ? 'border-danger bg-alarm text-white shadow-[0_0_14px_rgba(239,68,68,.9)]' : 'border-accent bg-deep/90 text-accent shadow-[0_0_14px_-2px_rgba(34,211,238,.9)]'}`;
  rLabel.textContent = stale ? `AMR-01 · vị trí cũ ${Math.round((Date.now() - APP.staleSince) / 1000)}s` : 'AMR-01';
  place(rLabel, robot.position, 2.4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
