    <!-- ═══════════════ HỆ THỐNG TRẠNG THÁI ═══════════════ -->

<!-- Hộp xác nhận ở giữa màn hình -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" role="presentation">

  <section id="modalBox" role="dialog" aria-modal="true" aria-labelledby="mTitle" class="relative flex max-h-[calc(100dvh-2rem)] w-full max-w-[560px] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl anim-rise"></section>
</div>
<!-- Thông báo nổi -->
<section id="toasts" aria-live="polite" aria-label="Thông báo" class="pointer-events-none fixed right-4 bottom-4 z-[60] flex w-[min(380px,calc(100vw-2rem))] flex-col gap-2"></section>

<script>
/* ════════ Biểu tượng ════════ */
const PATHS = {
  ok: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  play: '<path d="M7 4.5v15l12-7.5z"/>', next: '<path d="M5 4.5v15l10-7.5zM19 5v14"/>', stop: '<rect x="5" y="5" width="14" height="14" rx="2"/>',
  branch: '<circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="6" cy="19" r="2.5"/><path d="M6 7.5v9M18 9.5a6 6 0 0 1-6 6H6"/>',
  wifi: '<path d="M5 12.6a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01M2 8.8a15 15 0 0 1 20 0"/>',
  wifioff: '<path d="M2 2l20 20M8.5 16a5 5 0 0 1 7 0M12 19.5h.01M5 12.6a10 10 0 0 1 5.2-2.7M16.7 10.9a10 10 0 0 1 2.3 1.7M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8"/>',
  bat: '<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4M9.5 10v4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.8-1.2"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  xc: '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>', retry: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>', mute: '<path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  flag: '<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>', robot: '<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',
};
const ic = (n, cls = 'size-4') => `<svg class="${cls} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;

/* ════════ Hệ thống trạng thái Tour (dùng chung mọi màn) ════════
   Mỗi trạng thái = màu + biểu tượng + kiểu viền + chữ. Không dựa vào màu đơn lẻ. */
const STATE = {
  Scheduled: { vn: 'Đã lên lịch', icon: 'cal', badge: 'border border-dashed border-slate-400 bg-white text-slate-600' },
  Ready: { vn: 'Sẵn sàng · đã khóa', icon: 'lock', badge: 'border border-brand/40 bg-wash text-brand-700' },
  Running: { vn: 'Đang chạy', icon: 'play', badge: 'border border-navy bg-navy text-white' },
  Completed: { vn: 'Hoàn thành', icon: 'check', badge: 'border border-ok-line bg-ok-bg text-ok' },
  Cancelled: { vn: 'Đã hủy', icon: 'xc', badge: 'border border-slate-200 bg-slate-100 text-slate-500 line-through decoration-slate-400' },
};
const stateBadge = (s, extra = '') => `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11.5px] font-bold whitespace-nowrap ${STATE[s].badge} ${extra}">${s === 'Running' ? '<span class="relative flex size-2"><span class="absolute inline-flex size-full animate-ping rounded-full bg-emerald-300 opacity-75"></span><span class="relative inline-flex size-2 rounded-full bg-emerald-300"></span></span>' : ic(STATE[s].icon, 'size-3.5')}${STATE[s].vn}</span>`;
const assistBadge = () => `<span class="inline-flex items-center gap-1 rounded-full border border-bad bg-bad px-2 py-0.5 text-[11.5px] font-bold whitespace-nowrap text-white">${ic('alert', 'size-3.5')}Cần hỗ trợ</span>`;
const holdBadge = () => `<span class="inline-flex items-center gap-1 rounded-full border border-warn-line bg-warn-bg px-2 py-0.5 text-[11.5px] font-bold whitespace-nowrap text-warn">${ic('pause', 'size-3.5')}Đang giữ</span>`;

/* ════════ Dữ liệu mẫu ════════ */
const POI = {
  start: { n: 'Xuất phát', x: -16, z: 8 }, sanh: { n: 'Sảnh A', x: -12, z: 2 }, tv: { n: 'Thư viện', x: -5, z: -6 },
  rb: { n: 'Phòng Robotics', x: 3, z: -6, branch: true }, ai: { n: 'AI Lab', x: 10, z: 0 }, aix: { n: 'AI Lab mở rộng', x: 3, z: 5 },
  xu: { n: 'Xưởng chế tạo', x: 15, z: -6 }, end: { n: 'Kết thúc', x: 16, z: 8 },
};
const ROUTES = { main: ['start', 'sanh', 'tv', 'rb', 'ai', 'xu', 'end'], b: ['start', 'sanh', 'tv', 'rb', 'aix', 'ai', 'xu', 'end'], c: ['start', 'sanh', 'tv', 'rb', 'end'] };
const ROUTE_NAME = { main: 'Thư viện – AI Lab v3', b: 'Nhánh "AI Lab mở rộng"', c: 'Nhánh "Về sớm"' };
const STEP_VN = { PreparingStart: 'Quay FRONT trước chặng đầu', Navigating: 'Đang tới', Observing: 'Đang thuyết minh tại', HeldAtPoi: 'Đã tới, chưa bắt đầu xem tại', ReturningToEnd: 'Đang về điểm kết thúc', AtEnd: 'Đã về điểm kết thúc' };

const APP = window.APP = {}; window.APP_POI = POI; window.APP_ROUTES = ROUTES;
const T0 = Date.now(); const BASE = 9 * 3600 + 21 * 60;
const clock = (off = 0) => { const s = BASE + Math.floor((Date.now() - T0) / 1000) + off; return `${String(Math.floor(s / 3600) % 24).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const mmss = (s) => `${String(Math.floor(Math.max(s, 0) / 60)).padStart(2, '0')}:${String(Math.max(s, 0) % 60).padStart(2, '0')}`;
const cur = () => ROUTES[APP.route][APP.idx];

function reset(scen) {
  Object.assign(APP, { scen, state: 'Running', assist: null, hold: false, route: 'main', idx: 3, step: 'Observing', dwell: 45, dwellTotal: 60, anim: null, reqs: [], accepted: null, stale: false, staleSince: 0, reconnected: false, ack: false, log: [], endReason: null, preview: null, elapsed: 21 * 60 + 40, battery: 64 });
  const at = POI.rb; APP.robot = { x: at.x, z: at.z, h: 0 };
  APP.log = [['09:02', 'Buổi bắt đầu, 18/18 học sinh đã vào xem'], ['09:10', 'Tới POI 1 · Sảnh A'], ['09:16', 'Tới POI 2 · Thư viện'], ['09:20', 'Tới POI 3 · Phòng Robotics (điểm phân nhánh)']];
  if (scen === 'ready') { Object.assign(APP, { state: 'Ready', idx: 0, step: null, elapsed: 0 }); APP.robot = { x: POI.start.x, z: POI.start.z, h: 0 }; APP.log = [['08:50', 'Khóa READY · staff01'], ['09:18', 'Robot AMR-01 đã ở điểm xuất phát']]; }
  if (scen === 'branch') {
    APP.dwell = 70; APP.dwellTotal = 90;
    APP.reqs = [
      { id: 'r1', who: 'Đoàn 8A', school: 'THCS Hòa Bình', variant: 'b', label: 'Thêm điểm "AI Lab mở rộng"', delta: 6, ago: 34, status: 'pending' },
      { id: 'r2', who: 'Đoàn 8B', school: 'THCS Hòa Bình', variant: 'c', label: 'Rút ngắn: bỏ AI Lab, Xưởng, về luôn', delta: -9, ago: 12, status: 'pending' },
    ];
    APP.log.push(['09:21', 'Đoàn 8A gửi yêu cầu đổi nhánh'], ['09:21', 'Đoàn 8B gửi yêu cầu đổi nhánh']);
  }
  if (scen === 'hb') {
    Object.assign(APP, { step: 'Navigating', stale: true, staleSince: Date.now() - 12000, assist: 'RobotDisconnected', dwell: 0 });
    const a = POI.tv, b = POI.rb; APP.robot = { x: a.x + (b.x - a.x) * .62, z: a.z + (b.z - a.z) * .62, h: Math.atan2(b.x - a.x, b.z - a.z) };
    APP.log = APP.log.slice(0, 3).concat([['09:19', 'Rời Thư viện, đang tới Phòng Robotics'], ['09:21', 'Mất heartbeat robot > 5 giây · tự giữ lịch'], ['09:21', '1 yêu cầu đổi nhánh đang chờ đã tự hết hạn']]);
  }
}

/* ════════ Hành động (mỗi nút = một lệnh có sẵn: start / hold / next / endEarly / phục hồi) ════════ */
const waitingAtBranch = () => APP.state === 'Running' && !APP.assist && ['Observing', 'HeldAtPoi'].includes(APP.step) && POI[cur()].branch;
const log = (t) => APP.log.push([clock().slice(0, 5), t]);
const actionable = () => APP.reqs.find((r) => r.status === 'pending');
function gates() {
  const run = APP.state === 'Running', a = !!APP.assist, moving = APP.step === 'Navigating' || APP.step === 'ReturningToEnd' || APP.step === 'PreparingStart';
  return {
    start: APP.state === 'Ready' ? { ok: true } : { ok: false, why: 'Chỉ bắt đầu khi tour ở READY' },
    hold: !run ? { ok: false, why: 'Tour không chạy' } : a ? { ok: false, why: 'Đang có sự cố, dùng thao tác phục hồi' } : APP.step === 'AtEnd' ? { ok: false, why: 'Robot đã về điểm kết thúc' } : { ok: true },
    next: !run ? { ok: false, why: 'Tour không chạy' } : a ? { ok: false, why: 'Đang có sự cố, dùng thao tác phục hồi' } : moving ? { ok: false, why: 'Robot đang di chuyển, chờ tới POI' } : APP.step === 'AtEnd' ? { ok: false, why: 'Không còn POI' } : { ok: true },
    end: run ? { ok: true } : { ok: false, why: 'Tour không chạy' },
  };
}
function act(k, arg) {
  const g = gates();
  if (k === 'start' && g.start.ok) { APP.state = 'Running'; APP.step = 'PreparingStart'; log('Bắt đầu buổi · staff01'); toast('ok', 'Đã bắt đầu T-01', 'Robot quay FRONT rồi đi tới Sảnh A.'); setTimeout(() => go(1), 1500); }
  if (k === 'hold' && g.hold.ok) { APP.hold = !APP.hold; log(APP.hold ? 'Giữ tại POI (dừng tự chuyển bước)' : 'Tiếp tục lịch tự chuyển bước'); toast('info', APP.hold ? 'Đã giữ robot tại POI' : 'Đã tiếp tục', APP.hold ? 'Robot sẽ không tự đi tiếp cho tới khi bạn bấm Tiếp tục hoặc POI kế.' : `Còn ${mmss(APP.dwell)} rồi tự sang POI kế.`); }
  if (k === 'next' && g.next.ok) leave('Chuyển POI kế · staff01');
  if (k === 'accept') accept(arg);
  if (k === 'decline') decline(arg);
  if (k === 'ack') { APP.ack = true; log('staff01 đã nhận sự cố'); }
  if (k === 'recover') { APP.assist = null; APP.stale = false; APP.reconnected = false; log('Thử lại chặng · staff01'); toast('ok', 'Đã gửi lại chặng', 'Robot tiếp tục tới Phòng Robotics.'); go(APP.idx, true); }
  if (k === 'confirmEnd') { APP.state = 'Completed'; APP.step = null; log('Xác nhận hoàn tất · staff01'); toast('ok', 'Buổi đã hoàn thành', 'Live và AI của học sinh đã đóng.'); }
  if (k === 'endEarly') openEnd();
  render();
}
function leave(why) {
  const pending = APP.reqs.filter((r) => r.status === 'pending');
  if (pending.length && POI[cur()].branch) { pending.forEach((r) => (r.status = 'expired')); log(`${pending.length} yêu cầu đổi nhánh hết hạn (robot rời điểm phân nhánh)`); toast('warn', `${pending.length} yêu cầu đổi nhánh đã hết hạn`, 'Robot rời điểm phân nhánh trước khi có quyết định.'); }
  APP.hold = false; log(why); go(APP.idx + 1);
}
function go(i, sameTarget) {
  const r = ROUTES[APP.route]; if (i >= r.length) return;
  APP.idx = i; const to = POI[r[i]];
  APP.step = r[i] === 'end' ? 'ReturningToEnd' : 'Navigating';
  const from = { ...APP.robot }; const d = Math.hypot(to.x - from.x, to.z - from.z);
  APP.anim = { from, to, t0: performance.now(), dur: Math.max(1600, d * 260) };
  APP.robot.h = Math.atan2(to.x - from.x, to.z - from.z);
  render();
}
function arrive() {
  APP.anim = null; const k = cur();
  if (k === 'end') { APP.step = 'AtEnd'; log('Robot đã về điểm kết thúc'); toast('info', 'Robot đã về điểm kết thúc', 'Xác nhận hoàn tất để đóng buổi.'); }
  else { APP.step = 'Observing'; APP.dwell = POI[k].branch ? 60 : 30; APP.dwellTotal = APP.dwell; log(`Tới POI ${APP.idx} · ${POI[k].n}`); }
  render();
}
function accept(id) {
  const r = APP.reqs.find((x) => x.id === id), first = actionable();
  if (!r || r !== first || !waitingAtBranch() || APP.accepted) return;
  r.status = 'accepted'; APP.accepted = r.id; APP.route = r.variant; APP.preview = null;
  APP.reqs.filter((x) => x.status === 'pending').forEach((x) => (x.status = 'void'));
  log(`Chấp nhận đổi nhánh của ${r.who}: ${ROUTE_NAME[r.variant]}`);
  toast('ok', `Đã chấp nhận yêu cầu của ${r.who}`, `Tuyến đổi sang ${ROUTE_NAME[r.variant]} (${r.delta > 0 ? '+' : ''}${r.delta} phút). Các yêu cầu còn lại đã đóng.`);
  render();
}
function decline(id) {
  const r = APP.reqs.find((x) => x.id === id); if (!r || r !== actionable()) return;
  r.status = 'declined'; APP.preview = null; log(`Từ chối yêu cầu của ${r.who}`); toast('info', `Đã từ chối yêu cầu của ${r.who}`, 'Người gửi nhận được thông báo kèm lý do.'); render();
}

/* ════════ Vẽ: thanh trạng thái ════════ */
function renderStatus() {
  const s = APP.state, a = APP.assist, k = cur(), hbAge = APP.stale ? Math.round((Date.now() - APP.staleSince) / 1000) : 0;
  const red0 = !!APP.assist;
  const hb = APP.stale ? `<span class="inline-flex items-center gap-1 font-bold ${red0 ? 'text-white' : 'text-bad'}">${ic('wifioff', 'size-4')}Mất tín hiệu <span data-live="hb">${hbAge}</span> giây</span>` : APP.reconnected ? `<span class="inline-flex items-center gap-1 font-semibold ${red0 ? 'text-white' : 'text-ok'}">${ic('wifi', 'size-4')}Đã kết nối lại</span>` : `<span class="inline-flex items-center gap-1 font-semibold text-ok">${ic('wifi', 'size-4')}Live · 0,4 giây</span>`;
  const stepTxt = s === 'Ready' ? 'Chờ bắt đầu · robot ở điểm xuất phát' : s !== 'Running' ? (APP.endReason ? `Kết thúc sớm: ${APP.endReason}` : 'Buổi đã đóng') : APP.step === 'AtEnd' || APP.step === 'ReturningToEnd' || APP.step === 'PreparingStart' ? STEP_VN[APP.step] : `${STEP_VN[APP.step]} ${POI[k].n}`;
  const red = !!a;
  document.getElementById('status').className = `shrink-0 border-b transition-colors ${red ? 'border-bad bg-bad text-white' : 'border-line bg-white'}`;
  document.getElementById('status').innerHTML = `
  <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 px-4 py-2.5">

/* ════════ Thông báo nổi (giống Toaster hiện tại: thẻ trắng, chấm biểu tượng, thanh thời gian) ════════ */
function toast(tone, title, detail) {
  const dot = { ok: 'bg-ok', info: 'bg-brand', warn: 'bg-warn-solid', bad: 'bg-bad' }[tone], icn = { ok: 'ok', info: 'info', warn: 'alert', bad: 'x' }[tone];
  const el = document.createElement('div');
  el.className = 'pointer-events-auto relative flex items-start gap-2.5 overflow-hidden rounded-xl border border-[#e2e8f0] bg-white px-3 pt-2.5 pb-3 shadow-[0_14px_34px_-14px_rgba(15,23,42,0.35)] anim-rise';
  el.setAttribute('role', tone === 'bad' ? 'alert' : 'status');
  el.innerHTML = `<span class="mt-px grid size-6 shrink-0 place-items-center rounded-full text-white ${dot}">${ic(icn, 'size-[15px]')}</span><div class="min-w-0 flex-1"><p class="text-[13px] leading-5 font-semibold">${title}</p><p class="mt-px text-xs text-muted">${detail}</p></div><button class="grid size-6 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-slate-100" aria-label="Đóng thông báo">${ic('x', 'size-4')}</button><span class="absolute bottom-0 left-0 h-[3px] w-full ${dot} anim-toastbar"></span>`;
  const box = document.getElementById('toasts'); box.append(el); while (box.children.length > 3) box.firstElementChild.remove();
  const close = () => el.remove(); el.querySelector('button').onclick = close; setTimeout(close, 4000);
}

/* ════════ Âm báo sự cố (PWA: thêm rung + Notification khi tab ẩn) ════════ */
let actx = null, lastBeep = 0;
function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); [880, 660].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + i * .18; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16); o.start(t); o.stop(t + .17); }); navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {} }

function setView(v) {
  ['ops', 'states', 'prep'].forEach((k) => { document.getElementById(`v-${k}`).classList.toggle('hidden', k !== v); document.getElementById(`v-${k}`).classList.toggle('flex', k === 'ops' && v === 'ops'); });
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === v));
  document.getElementById('scenbar').classList.toggle('hidden', v !== 'ops');
  if (v === 'states') renderStates(); if (v === 'prep') renderPrep();
  window.dispatchEvent(new Event('resize'));
}
function setScen(s) { document.getElementById('toasts').innerHTML = ''; closeModal(); reset(s); document.querySelectorAll('[data-scen]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.scen === s)); render(); if (s === 'hb') beep(); }

document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]'); if (v) return setView(v.dataset.view);
  const s = e.target.closest('[data-scen]'); if (s) return setScen(s.dataset.scen);
  if (e.target.closest('#reconnect')) { APP.stale = false; APP.reconnected = true; log('Robot kết nối lại · vị trí mới 0,3 giây'); toast('ok', 'Robot đã kết nối lại', 'Chọn cách phục hồi để chạy tiếp.'); return render(); }
  if (e.target.closest('[data-close]')) return closeModal();
  const c = e.target.closest('[data-cam]'); if (c) { window.TWIN && window.TWIN.cam(c.dataset.cam); document.querySelectorAll('[data-cam]').forEach((b) => b.setAttribute('aria-pressed', b === c)); return; }
  const a = e.target.closest('[data-act]'); if (a && !a.disabled) { const id = a.dataset.act, focusKey = `[data-act="${id}"]${a.dataset.id ? `[data-id="${a.dataset.id}"]` : ''}`; act(id, a.dataset.id); const again = document.querySelector(focusKey); if (again && !again.disabled) again.focus(); }
});
const setPreview = (v) => { if (APP.preview === v) return; APP.preview = v || null; renderStepper(); renderOverlay(); };
document.addEventListener('pointerover', (e) => { const li = e.target.closest('[data-preview]'); setPreview(li && li.dataset.preview); });
document.addEventListener('focusin', (e) => { const li = e.target.closest('[data-preview]'); setPreview(li && li.dataset.preview); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeModal();
  if (e.target.closest('input,textarea,select,[role=dialog]') || e.metaKey || e.ctrlKey || e.altKey || document.getElementById('v-ops').classList.contains('hidden')) return;
  const k = e.key.toLowerCase(), f = actionable();
  if (k === 'h' && gates().hold.ok) act('hold');
  if (k === 'n' && gates().next.ok) act('next');
  if (k === 'a' && f) act('accept', f.id);
  if (k === 'd' && f) act('decline', f.id);
});

  if (APP.state === 'Running' && !APP.assist) APP.elapsed++;

  if (APP.state === 'Running' && APP.step === 'Observing' && !APP.hold && !APP.assist) { APP.dwell--; if (APP.dwell <= 0) leave('Hết thời gian dừng, tự sang POI kế'); }
  if (APP.assist && !APP.ack && Date.now() - lastBeep > 6000) { lastBeep = Date.now(); if (actx) beep(); }
  const hbAge = Math.round((Date.now() - APP.staleSince) / 1000);
  const set = (k, v) => document.querySelectorAll(`[data-live="${k}"]`).forEach((n) => (n.textContent = v));
  set('clock', clock()); set('elapsed', mmss(APP.elapsed)); set('hb', hbAge); set('hb2', hbAge); set('inc', mmss(hbAge)); set('dwell', ['Navigating', 'ReturningToEnd', 'PreparingStart'].includes(APP.step) ? '—' : mmss(APP.dwell)); set('dwell2', mmss(APP.dwell));
  APP.reqs.forEach((r) => document.querySelectorAll(`[data-ago="${r.id}"]`).forEach((n) => (n.textContent = r.ago)));
  if (APP.state === 'Running' && APP.step === 'Observing') { const ring = document.querySelector('[aria-label="Bước hiện tại"] circle:nth-child(2)'); if (ring) ring.setAttribute('stroke-dasharray', `${(1 - APP.dwell / APP.dwellTotal) * 150.8} 150.8`); }
}, 1000);
/* chuyển động robot */
(function loop(t) { if (APP.anim) { const { from, to, t0, dur } = APP.anim; const p = Math.min((t - t0) / dur, 1), e = p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2; APP.robot.x = from.x + (to.x - from.x) * e; APP.robot.z = from.z + (to.z - from.z) * e; if (p >= 1) arrive(); } requestAnimationFrame(loop); })(performance.now());

/* Bản đồ dự phòng (khi không tải được 3D): sơ đồ phẳng SVG */
setTimeout(() => { if (window.TWIN) return; const host = document.getElementById('twin'); const sx = (x) => (x + 20) * 20, sz = (z) => (z + 12) * 20; host.innerHTML = `<svg viewBox="0 0 800 480" class="size-full"><rect width="800" height="480" fill="#eef4f9"/>${ROUTES.main.map((k, i, a) => (i ? `<line x1="${sx(POI[a[i - 1]].x)}" y1="${sz(POI[a[i - 1]].z)}" x2="${sx(POI[k].x)}" y2="${sz(POI[k].z)}" stroke="#2d719e" stroke-width="5"/>` : '')).join('')}${Object.entries(POI).map(([k, p]) => `<circle cx="${sx(p.x)}" cy="${sz(p.z)}" r="9" fill="#fff" stroke="#173b59" stroke-width="3"/><text x="${sx(p.x) + 12}" y="${sz(p.z) - 10}" font-size="13" font-weight="700" fill="#1d2a36">${p.n}</text>`).join('')}<circle id="fbRobot" r="12" fill="#b23e31" stroke="#fff" stroke-width="4"/></svg><p class="absolute bottom-20 left-3 rounded bg-white/90 px-2 py-1 text-xs">Không tải được 3D (cần mạng). Đây là sơ đồ phẳng thay thế.</p>`; (function f() { const r = document.getElementById('fbRobot'); if (r) { r.setAttribute('cx', sx(APP.robot.x)); r.setAttribute('cy', sz(APP.robot.z)); } requestAnimationFrame(f); })(); }, 4000);

setView('ops'); setScen('run');
</script>

<!-- ════════ Digital Twin 3D (trong app: thay bằng component OperationalTwin hiện có) ════════ -->
<script type="module">
import * as THREE from 'three';
const host = document.getElementById('twin'), labels = document.getElementById('labels'), APP = window.APP, P = window.APP_POI, ROUTES = window.APP_ROUTES;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); host.appendChild(renderer.domElement);
renderer.domElement.style.cssText = 'width:100%;height:100%;display:block;touch-action:none';
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, .1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfdbe6, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(12, 30, 16); scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(46, 30), new THREE.MeshStandardMaterial({ color: 0xf8fbfd, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(46, 46, 0xdbe5ee, 0xe9eff4); grid.position.y = .01; scene.add(grid);
/* phòng: hộp mờ + viền */
const roomMat = new THREE.MeshStandardMaterial({ color: 0xcfe2f1, transparent: true, opacity: .22, depthWrite: false });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x9db7cc });
[['sanh', 7, 6], ['tv', 8, 6], ['rb', 7, 6], ['ai', 7, 7], ['aix', 6, 5], ['xu', 6, 6]].forEach(([k, w, d]) => { const g = new THREE.BoxGeometry(w, 1.1, d); const m = new THREE.Mesh(g, roomMat); m.position.set(P[k].x, .55, P[k].z); scene.add(m); const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat); e.position.copy(m.position); scene.add(e); });

const v3 = (k, y = .08) => new THREE.Vector3(P[k].x, y, P[k].z);
function tube(keys, color, r = .16, opacity = 1) { const path = new THREE.CurvePath(); for (let i = 1; i < keys.length; i++) path.add(new THREE.LineCurve3(v3(keys[i - 1]), v3(keys[i]))); return new THREE.Mesh(new THREE.TubeGeometry(path, keys.length * 24, r, 8, false), new THREE.MeshStandardMaterial({ color, transparent: opacity < 1, opacity })); }
function dots(keys, color) { const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color }); for (let i = 1; i < keys.length; i++) { const a = v3(keys[i - 1], .2), b = v3(keys[i], .2), n = Math.ceil(a.distanceTo(b) / .7); for (let j = 0; j <= n; j++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.14, 10, 8), m); s.position.lerpVectors(a, b, j / n); g.add(s); } } return g; }
let routeKey = '', routeObj = null, doneObj = null, prevKey = '', prevObj = null;
const markers = {};
Object.keys(P).forEach((k) => { const g = new THREE.Group(); const base = new THREE.Mesh(new THREE.CylinderGeometry(.62, .62, .18, 28), new THREE.MeshStandardMaterial({ color: 0xffffff })); base.position.y = .09; g.add(base); const ring = new THREE.Mesh(new THREE.TorusGeometry(.62, .09, 8, 32), new THREE.MeshStandardMaterial({ color: 0x2d719e })); ring.rotation.x = Math.PI / 2; ring.position.y = .2; g.add(ring); if (P[k].branch) { const d = new THREE.Mesh(new THREE.OctahedronGeometry(.42), new THREE.MeshStandardMaterial({ color: 0x1f9d73 })); d.position.y = 1.5; d.name = 'diamond'; g.add(d); } g.position.set(P[k].x, 0, P[k].z); scene.add(g); markers[k] = { g, ring, base };
  const el = document.createElement('div'); el.className = 'absolute -translate-x-1/2 -translate-y-full whitespace-nowrap rounded-md bg-white/95 px-1.5 py-0.5 text-[11px] font-semibold text-ink shadow-xs ring-1 ring-black/5'; el.textContent = P[k].n; labels.appendChild(el); markers[k].el = el; });

/* robot */
const robot = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .5, transparent: true }), navyMat = new THREE.MeshStandardMaterial({ color: 0x173b59, transparent: true }), accMat = new THREE.MeshStandardMaterial({ color: 0x2d719e, transparent: true });
const body = new THREE.Mesh(new THREE.CylinderGeometry(.75, .85, 1, 32), bodyMat); body.position.y = .55; robot.add(body);
const band = new THREE.Mesh(new THREE.CylinderGeometry(.77, .77, .16, 32), navyMat); band.position.y = .82; robot.add(band);
const head = new THREE.Mesh(new THREE.SphereGeometry(.4, 24, 16), navyMat); head.position.y = 1.35; robot.add(head);
const nose = new THREE.Mesh(new THREE.ConeGeometry(.22, .5, 16), accMat); nose.rotation.x = Math.PI / 2; nose.position.set(0, .6, .95); robot.add(nose);
const pulse = new THREE.Mesh(new THREE.RingGeometry(.95, 1.15, 40), new THREE.MeshBasicMaterial({ color: 0x2d719e, transparent: true, side: THREE.DoubleSide })); pulse.rotation.x = -Math.PI / 2; pulse.position.y = .03; robot.add(pulse);
const unc = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshBasicMaterial({ color: 0xb23e31, transparent: true, opacity: .16, depthWrite: false })); unc.rotation.x = -Math.PI / 2; unc.position.y = .04; scene.add(unc);
scene.add(robot);
const rLabel = document.createElement('div'); labels.appendChild(rLabel);

/* camera: kéo để xoay, cuộn để thu phóng */
const cam = { theta: .55, phi: .95, r: 40, tx: 0, tz: 1, mode: 'overview' };
const PRESETS = { overview: { theta: .55, phi: .95, r: 40 }, top: { theta: 0, phi: .02, r: 44 }, follow: { theta: .7, phi: .85, r: 17 } };
window.TWIN = { cam(m) { cam.mode = m; Object.assign(cam, PRESETS[m]); if (m !== 'follow') { cam.tx = 0; cam.tz = 1; } } };
document.querySelector('[data-cam=overview]').setAttribute('aria-pressed', 'true');
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, t: cam.theta, p: cam.phi }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => { if (!drag) return; cam.theta = drag.t - (e.clientX - drag.x) * .006; cam.phi = Math.min(1.45, Math.max(.02, drag.p - (e.clientY - drag.y) * .006)); });
renderer.domElement.addEventListener('pointerup', () => (drag = null));
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); cam.r = Math.min(80, Math.max(9, cam.r * (1 + Math.sign(e.deltaY) * .08))); }, { passive: false });

function resize() { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host); addEventListener('resize', resize); resize();
const tmp = new THREE.Vector3();
function place(el, pos, yOff = 0) { tmp.copy(pos); tmp.y += yOff; tmp.project(camera); const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1; el.style.display = vis ? '' : 'none'; el.style.left = `${(tmp.x * .5 + .5) * host.clientWidth}px`; el.style.top = `${(-tmp.y * .5 + .5) * host.clientHeight}px`; }

function frame(t) {
  /* tuyến đang chạy + phần đã đi */
  const rk = APP.route + ':' + APP.idx + ':' + APP.state;
  if (rk !== routeKey) { routeKey = rk; [routeObj, doneObj].forEach((o) => o && scene.remove(o)); const keys = ROUTES[APP.route]; routeObj = tube(keys, 0x7db9db, .15); scene.add(routeObj); const doneKeys = keys.slice(0, Math.max(APP.state === 'Completed' && !APP.endReason ? keys.length : APP.idx, 1)); doneObj = doneKeys.length > 1 ? tube(doneKeys, 0x1f7a55, .19) : null; doneObj && scene.add(doneObj);
    Object.entries(markers).forEach(([k, m]) => { const on = keys.includes(k); m.g.visible = on || k === 'aix'; m.g.scale.setScalar(on ? 1 : .7); const i = keys.indexOf(k); const c = !on ? 0xb6c4d0 : i < APP.idx || (APP.state === 'Completed' && !APP.endReason) ? 0x1f7a55 : i === APP.idx ? (APP.assist ? 0xb23e31 : 0x173b59) : 0x2d719e; m.ring.material.color.setHex(c); m.el.style.opacity = on ? 1 : .55; }); }
  const pk = APP.preview || ''; if (pk !== prevKey) { prevKey = pk; prevObj && scene.remove(prevObj); prevObj = pk ? dots(ROUTES[pk].slice(ROUTES[pk].indexOf('rb')), 0x1f9d73) : null; prevObj && scene.add(prevObj); }
  /* robot */
  robot.position.set(APP.robot.x, 0, APP.robot.z); robot.rotation.y += ((APP.robot.h || 0) - robot.rotation.y) * .12;
  const stale = APP.stale; [bodyMat, navyMat, accMat].forEach((m) => (m.opacity = stale ? .38 : 1));
  const s = 1 + ((t / 900) % 1) * .9; pulse.scale.setScalar(stale ? 1 : s); pulse.material.opacity = stale ? 0 : 1 - ((t / 900) % 1); pulse.material.color.setHex(APP.assist ? 0xb23e31 : 0x2d719e);
  unc.visible = stale; if (stale) { const age = (Date.now() - APP.staleSince) / 1000; unc.scale.setScalar(Math.min(1.2 + age * .12, 6)); unc.position.set(APP.robot.x, .04, APP.robot.z); }
  Object.values(markers).forEach((m) => { const d = m.g.getObjectByName('diamond'); if (d) { d.rotation.y = t / 700; d.position.y = 1.5 + Math.sin(t / 400) * .12; } });
  if (cam.mode === 'follow') { cam.tx += (APP.robot.x - cam.tx) * .08; cam.tz += (APP.robot.z - cam.tz) * .08; }
  camera.position.set(cam.tx + cam.r * Math.sin(cam.phi) * Math.sin(cam.theta), cam.r * Math.cos(cam.phi), cam.tz + cam.r * Math.sin(cam.phi) * Math.cos(cam.theta)); camera.lookAt(cam.tx, 0, cam.tz);
  renderer.render(scene, camera);
  Object.entries(markers).forEach(([k, m]) => { place(m.el, m.g.position, 1.1); if (Math.hypot(m.g.position.x - robot.position.x, m.g.position.z - robot.position.z) < 1.6) m.el.style.display = 'none'; });
  rLabel.className = `absolute -translate-x-1/2 -translate-y-full whitespace-nowrap rounded-full px-2 py-0.5 text-[11px] font-bold text-white shadow ${stale ? 'bg-bad' : 'bg-navy'}`;
  rLabel.textContent = stale ? `AMR-01 · vị trí cũ ${Math.round((Date.now() - APP.staleSince) / 1000)} giây` : 'AMR-01';
  place(rLabel, robot.position, 2.3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
