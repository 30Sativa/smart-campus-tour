<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar Staff · 4 phương án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--navy:#173b59;--primary:#2d719e;--wash:#e5f3ff;--wash-2:#f1f8fe;--ground:#f6f7f9;--line:#e2e8f0;--line-soft:#eef1f4;--muted:#64748b;--text-2:#334155;--bad:#dc2626}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--ground);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.picker{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.picker .seg{display:inline-flex;background:#e8edf2;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.picker .seg button{border:none;background:none;border-radius:8px;padding:5px 12px;font-weight:600;font-size:12.5px;color:var(--text-2);cursor:pointer}
.picker .seg button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.picker .note{font-size:12px;color:var(--muted);flex:1 1 320px}
.frame{display:flex;min-height:calc(100vh - 51px)}
.page{flex:1;min-width:0;padding:18px 24px}
.page .crumb{font-size:12px;color:var(--muted)}
.page h1{font-size:21px;font-weight:700;letter-spacing:-.025em;color:var(--navy);margin-top:2px}
.ghost{margin-top:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ghost div{height:76px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.ghost .w{grid-column:span 3;height:300px}.ghost .t{grid-column:span 1;height:300px}
.page p.hint{margin-top:10px;color:var(--muted);font-size:12.5px;max-width:70ch}

/* shared sidebar bits */
.sb{flex:none;background:#fff;box-shadow:1px 0 0 #eceef1;position:sticky;top:51px;height:calc(100vh - 51px);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;flex:none;text-decoration:none;color:var(--ink)}
.brand .mark{width:32px;height:32px;flex:none;border-radius:10px;background:#fff;box-shadow:0 0 0 1px #e5e7eb,0 6px 14px -8px rgba(17,24,39,.35);display:grid;place-items:center}
.brand .mark img{width:25px;height:25px;object-fit:contain}
.brand b{display:block;font-size:14px;letter-spacing:-.03em}.brand small{display:block;font-size:11px;color:#6b7280;font-weight:600}
.scroll{flex:1;overflow-y:auto;padding:0 10px 12px;scrollbar-width:thin}
.it{display:flex;align-items:center;gap:10px;width:100%;min-height:30px;padding:0 10px;border:none;background:none;border-radius:8px;color:#374151;text-decoration:none;cursor:pointer;text-align:left;white-space:nowrap}
.it svg{flex:none;color:#6b7280}
.it:hover{background:#f3f4f6;color:var(--ink)}
.it[aria-current]{background:var(--wash-2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.it[aria-current] svg{color:var(--primary)}
.it .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.n{min-width:20px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--primary);padding:0 6px}
.n.r{background:var(--bad)}
.grp{font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 10px 3px}
.foot{flex:none;border-top:1px solid #eceef1;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px}
.foot .av{width:30px;height:30px;border-radius:50%;background:var(--wash);color:var(--primary);font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.foot b{display:block;font-size:12.5px}.foot span{color:var(--muted)}
.live{margin:4px 10px 6px;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--navy);color:#fff;border:none;cursor:pointer;text-align:left;width:calc(100% - 20px)}
.live i{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.live b{display:block;font-size:12.5px}.live small{font-size:11px;opacity:.85}
.sb[hidden]{display:none}

/* A: grouped by the day's rhythm */
#sb-a{width:236px}
.a-grp{margin-top:4px;border-top:1px solid var(--line-soft);padding-top:2px}
.a-grp:first-of-type{border-top:none}

/* B: domain rail + page panel */
#sb-b{width:auto;flex-direction:row;overflow:visible}
.rail{width:64px;background:#fff;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail .mark{width:34px;height:34px;border-radius:10px;box-shadow:0 0 0 1px #e5e7eb;display:grid;place-items:center;margin-bottom:8px}
.rail .mark img{width:26px;height:26px}
.dom{width:52px;min-height:52px;border:none;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:#475569;cursor:pointer;position:relative}
.dom:hover{background:#f3f4f6}
.dom[aria-pressed=true]{background:var(--wash);color:var(--navy)}
.dom .dotn{position:absolute;top:6px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #fff}
.rail .sp{flex:1}
.panelnav{width:224px;display:flex;flex-direction:column}
.panelnav h2{font-size:15px;font-weight:700;color:var(--navy);padding:16px 14px 2px}
.panelnav p{font-size:11.5px;color:var(--muted);padding:0 14px 8px}

/* C: urgent counters + collapsible groups + search */
#sb-c{width:244px}
.search{margin:0 10px 8px;display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;border-radius:9px;background:var(--ground);border:1px solid var(--line);color:var(--muted);font-size:12.5px;cursor:text}
.search kbd{margin-left:auto;font:inherit;font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.urgent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 10px 6px}
.urgent button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;text-align:left;cursor:pointer}
.urgent button:hover{border-color:#a8cde6}
.urgent b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.urgent small{font-size:10.5px;color:var(--muted);line-height:1.2;display:block}
.urgent .r b{color:var(--bad)}
.acc{width:100%;display:flex;align-items:center;gap:8px;border:none;background:none;padding:10px 10px 4px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.acc svg{transition:transform .15s}
.acc[aria-expanded=false] svg{transform:rotate(-90deg)}
.acc .cnt{margin-left:auto;font-weight:500}
.accbody[hidden]{display:none}
.cta{margin:8px 10px 0;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:9px;background:var(--primary);color:#fff;font-weight:600;border:none;cursor:pointer;width:calc(100% - 20px)}

/* D: work-mode switch */
#sb-d{width:236px}
.mode{margin:2px 10px 8px;display:grid;grid-template-columns:1fr 1fr;background:#e8edf2;border-radius:10px;padding:3px}
.mode button{border:none;background:none;border-radius:8px;padding:6px 0;font-weight:600;font-size:12.5px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.mode button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.mode .n{height:16px;min-width:16px;font-size:10px;padding:0 4px}
.modebody[hidden]{display:none}
.pinned{border-top:1px solid var(--line-soft);padding:6px 10px}

@media (max-width:820px){.ghost{grid-template-columns:1fr 1fr}.ghost .w,.ghost .t{grid-column:span 2;height:160px}.page{padding:14px}}
</style>
</head>
<body>
<div class="picker">
  <div class="seg" role="group" aria-label="Phương án sidebar">
    <button data-o="a" aria-pressed="true">A · Theo nhịp làm việc</button><button data-o="b" aria-pressed="false">B · Hai tầng</button><button data-o="c" aria-pressed="false">C · Việc gấp + thu gọn</button><button data-o="d" aria-pressed="false">D · Chuyển chế độ</button>
  </div>
  <span class="note" id="note"></span>
</div>
<div class="frame">
  <aside class="sb" id="sb-a" aria-label="Sidebar phương án A"></aside>
  <aside class="sb" id="sb-b" aria-label="Sidebar phương án B" hidden></aside>
  <aside class="sb" id="sb-c" aria-label="Sidebar phương án C" hidden></aside>
  <aside class="sb" id="sb-d" aria-label="Sidebar phương án D" hidden></aside>
  <main class="page"><div class="crumb" id="crumb"></div><h1 id="title"></h1><p class="hint" id="hint"></p><div class="ghost"><div></div><div></div><div></div><div></div><div class="w"></div><div class="t"></div></div></main>
</div>
<script>
const LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEwAAABMCAYAAADHl1ErAAAGR0lEQVR42u2aX4gdVx3Hv98zZ2Y3kjXZZrGprpKm22y998zeLJeWgsg+iGiQvggLVqwIGrQKRVsIiAZEtEXxX6GCrdIiVkTUlyBSfduHFJtmyd69d+ZuNlGybQput1TTTXM3d2bOz4d798/dzN4GTMze7fk8XGaGuWd+8z2/c87v9zsDOBwOh8PhcDgcDofD4XA4HA6Hw+FwOBzedjSqXC77g4ODemlpKdtutqntZlChUHiw2Vw5rZU6XSwWH9pu9nE7GVMaHT2Q+f6sp9QACFhrGwDHq9XqWedhOSSe9z4SAyICsSJKqV3W2jvckNyaGIKTIACCYuV0f3//GTckuw3L0t0fsFnfywBoRe6LouhV52FdqFTOLQrkMkSuRFH0L7dKvvMqqQBQCI6MjCi3Sm549sTExDVx4NLSUr9HVoRQSZKO7d+/v7H5nqmpqQyAvBsEU2EYPkBgUoACRPoFELYsIUCIWEXwbhAQkXMkLVonACAkKcBVisT08MdKpXYCQLbjBBsdHX1/EOhnPM//FERgxS6KSKNlA7nuMSIEE7QuBKvXABDtX4K7SN5ORWSZfQHA0Wq1enHHCDYyct97+/uv/NXX+v7M2hMi8kQQBHXf95tJkhAAfN+XJEno+/7aUNt8vuF6kCTJPWLtMe3rT6dpekop7xOVSuU/OyJhNcYcHx8/LMaY5yYnb2j+qsIwfHp8/LCEYfjdHeFhw8PDu/bu3VshMSgCU6vVFm9k+4cOHRrq6+urEXjbD4Jwenr6Sk+HFfv27boNkIMQ/P1GiwUA8/Pzb8DaFwW4s9FoDN3s99E3q+FisXiXUuqjNrUHlae8LLOv590XhuGoUs2rlcrZC93aGxsbuzNJEl2v18/ldPuSaq2eR40x/0zT9OTc3Nx8z3jYxMSEJvC8Uuo5et5xgqCIbK55GWN+TmBGJJgZGzOPbNVeGIbHAKloz5sxpviTycnJznnQtl9Ge9/2lHrW87zflstlv2cEu3DhggY5JNZCrG0ppToftbKycq9S/CrIfpJ7AH7HGHN7jljDAI4THCD5HqXUN+bm5g5v1ksAiBWxYqHIQQB+j81hsiGYlHU3WJ8LSHasOcpay64rU/vAs1Zt9RIEIRCbF45sb8Gk/Xpc++l4gUTkZRH8ikATwDIF34/j+Jpku1qtXrQij0PkbQBXRfCLPUNDZ3JF5bpoPTfpb7SZOX0Tx3ETwNFSqfSzNE1Xoij6x1ZN1Wq1J8YLhT80ST+KovrW3U6QhEC4GhD3jmCy5mNdY75KpRJdT3Nn4vj8lo8SEgqgrD3bLi4u9tiQJNkxTnKqC2GxeMwY873rbTEsFh83xjyW1zsdBySGh4d7J3A90NJLK6rWzM5cDyPII76vv9VOa1S3MMUY8wMd+N9UwJFrlBQIBCCpQEJE/L6+PumZITm1sLAyZsyTYu2kQHaT6nCOhwnIr6Rp9met9fGxMCwL8NNGo3Hq/PnzbwFAqVTaKyL3v/nmG4/62v94lqRnkyx7OKfbpbXLJDMElkXkT1NTUys9mUsaY+5RZN2K/L5Wq30mLyPQSj1Fz/skIMiy7DUAr7XN+6BSvKM1T9kTSZI9Uq/XF3La+I3nqc+RylzvnLhtBSuXy3uazZWzEC6/tbwcLiws5PW8MsYcUUp9VkTuBbCvXU18XYCXMmt/F8fxC8gvaQdaq1kR7gNwqFqt/rvn62HGmF/6Wn+pmSRfj6Loye61s5E+rfXuVnKgltvhB7qkTV/T2nsqy9Jfz87WvrAjCoiFQmHE87yTAG4DcCwIgmenp6cv4X+r4A4EQfBFAj8U4BLJj8zOzs7vmBJ1GH74Y4R+3tPe/jTNXhGRGVKWYQEhLSkEFGGtbGGn2NZKakkMkCxpTx/IrF3MsuzzURT9bcdtgoRheJCURwE+AMGHqNTq const I = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  play: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="m10 8 4 2.5-4 2.5zM8 21h8"/>',
  bot: '<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M8.5 13h.01M15.5 13h.01"/>',
  head: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="4" height="6" rx="1.5"/><rect x="17.5" y="14" width="4" height="6" rx="1.5"/>',
  clip: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  plus: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M12 13v5M9.5 15.5h5"/>',
  check: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  todo: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l1.5 1.5L11 8M13 9h4M7 15l1.5 1.5L11 14M13 15h4"/>',
  route: '<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H17a3.5 3.5 0 0 0 0-7H7a3.5 3.5 0 0 1 0-7h8.5"/>',
  pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  hist: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 8v4l3 2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
};
const ic = (n, s = 17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
// Every current Staff page, unchanged.
const P = {
  overview: ['Tổng quan vận hành', 'dash', '/staff'], today: ['Buổi hôm nay', 'list', '/staff/tours'], schedule: ['Lịch buổi', 'cal', '/staff/schedule'],
  live: ['Điều hành trực tiếp', 'play', '/staff/live'], robot: ['Robot & thiết bị', 'bot', '/staff/robot'], intercom: ['Đàm thoại Quest', 'head', '/staff/intercom'],
  prep: ['Tổng quan chuẩn bị', 'clip', '/staff/manage'], tours: ['Danh sách Tour', 'list', '/staff/manage/tours'], create: ['Tạo Tour', 'plus', '/staff/manage/tours/new'],
  pending: ['Đăng ký chờ duyệt', 'check', '/staff/manage/registrations/pending'], regs: ['Tất cả đăng ký', 'todo', '/staff/manage/registrations'],

};
const BADGE = { live: [1, 'r', '1 buổi cần hỗ trợ'], pending: [3, '', '3 đoàn chờ duyệt'] };
let cur = 'overview';
const item = (k, label) => { const [name, icon] = P[k]; const b = BADGE[k]; return `<button class="it" data-p="${k}" ${k === cur ? 'aria-current="page"' : ''}>${ic(icon)}<span class="lb">${label || name}</span>${b ? `<span class="n ${b[1]}" aria-label="${b[2]}">${b[0]}</span>` : ''}</button>`; };
const brand = (sub = 'DT-AMR · Vận hành') => `<a class="brand" href="#" data-p="overview"><span class="mark"><img src="${LOGO}" alt=""></span><span><b>CampusTour</b><small>${sub}</small></span></a>`;
const foot = `<div class="foot"><span class="av">S1</span><div style="flex:1;min-width:0"><b>staff01</b><span>Nhân viên vận hành</span></div><button class="it" style="width:auto;padding:0 6px" aria-label="Đăng xuất">${ic('out')}</button></div>`;
const livecard = `<button class="live" data-p="live"><i></i><span><b>Đang chạy T-01</b><small>Chặng 3/4, cần hỗ trợ</small></span></button>`;

function renderA() {
  document.getElementById('sb-a').innerHTML = brand() + livecard + `<div class="scroll">
    <div class="a-grp"><div class="grp">Trong ngày</div>${item('overview')}${item('today')}${item('schedule')}</div>
    <div class="a-grp"><div class="grp">Điều hành</div>${item('live')}${item('robot')}${item('intercom')}</div>

    <div class="a-grp"><div class="grp">Lịch sử</div>${item('history')}</div></div>` + foot;
}
const DOMAINS = {

  run: { name: 'Điều hành', short: 'Điều hành', icon: 'play', pages: ['live', 'robot', 'intercom'], desc: 'Robot, livestream và đàm thoại', alert: true },
  prep: { name: 'Chuẩn bị Tour', short: 'Chuẩn bị', icon: 'clip', pages: ['prep', 'tours', 'create', 'pending', 'regs', 'routes', 'pois'], desc: 'Tour, đăng ký, tuyến và POI', alert: true },
  hist: { name: 'Lịch sử', short: 'Lịch sử', icon: 'hist', pages: ['history'], desc: 'Các phiên đã chạy' },
};
const domainOf = (k) => Object.keys(DOMAINS).find((d) => DOMAINS[d].pages.includes(k));
let dom = 'day';
function renderB() {
  const d = DOMAINS[dom];
  document.getElementById('sb-b').innerHTML = `<div class="rail"><a class="mark" href="#" data-p="overview" aria-label="CampusTour"><img src="${LOGO}" alt=""></a>${Object.entries(DOMAINS).map(([k, v]) => `<button class="dom" data-d="${k}" aria-pressed="${k === dom}">${ic(v.icon, 20)}${v.short}${v.alert ? '<span class="dotn" aria-label="có việc cần làm"></span>' : ''}</button>`).join('')}<span class="sp"></span><span class="foot" style="border:none;padding:6px"><span class="av">S1</span></span></div>
  <div class="panelnav"><h2>${d.name}</h2><p>${d.desc}</p>${dom === 'run' ? livecard : ''}<div class="scroll">${d.pages.map((k) => item(k)).join('')}</div></div>`;
}
const open = { day: true, run: true, prep: false, hist: false };
function renderC() {
  const grp = (k, title, pages) => `<button class="acc" data-acc="${k}" aria-expanded="${open[k]}">${ic('chev', 14)}${title}<span class="cnt">${pages.length}</span></button><div class="accbody" ${open[k] ? '' : 'hidden'}>${pages.map((p) => item(p)).join('')}</div>`;
  document.getElementById('sb-c').innerHTML = brand() + `<div class="search" role="button" tabindex="0">${ic('search', 15)}Tìm trang, buổi, đoàn<kbd>Ctrl K</kbd></div>
    <div class="urgent"><button class="r" data-p="live"><b>1</b><small>cần hỗ trợ</small></button><button data-p="pending"><b>3</b><small>chờ duyệt</small></button><button data-p="today"><b>4</b><small>buổi hôm nay</small></button></div>
    <div class="scroll">${grp('day', 'Trong ngày', ['overview', 'today', 'schedule'])}${grp('run', 'Điều hành', ['live', 'robot', 'intercom'])}${grp('prep', 'Chuẩn bị Tour', ['prep', 'tours', 'create', 'pending', 'regs', 'routes', 'pois'])}${grp('hist', 'Lịch sử', ['history'])}</div>
    <button class="cta" data-p="create">${ic('plus', 15)}Tạo Tour</button>` + foot;
}
let mode = 'run';
function renderD() {
  document.getElementById('sb-d').innerHTML = brand() + `<div class="mode" role="group" aria-label="Chế độ làm việc"><button data-m="run" aria-pressed="${mode === 'run'}">Vận hành <span class="n r">1</span></button><button data-m="prep" aria-pressed="${mode === 'prep'}">Chuẩn bị <span class="n">3</span></button></div>
    <div class="scroll">${mode === 'run'
      ? `${livecard.replace('class="live"', 'class="live" style="margin:0 0 6px;width:100%"')}<div class="grp">Trong ngày</div>${item('overview')}${item('today')}${item('schedule')}<div class="grp">Điều hành</div>${item('live')}${item('robot')}${item('intercom')}`
      : `<div class="grp">Tour</div>${item('prep')}${item('tours')}${item('create')}<div class="grp">Đăng ký</div>${item('pending')}${item('regs')}<div class="grp">Danh mục</div>${item('routes')}${item('pois')}`}</div>
    <div class="pinned">${item('history')}</div>` + foot;
}
const NOTES = {
  a: 'Giữ đủ 14 trang, chia 4 nhóm luôn mở theo nhịp trong ngày. Ô "Đang chạy" ở đầu đưa thẳng tới điều hành.',
  b: 'Cột icon chọn 4 khu vực; cột thứ hai chỉ hiện trang của khu vực đó. Danh sách ngắn, không phải cuộn.',
  c: 'Ba con số việc gấp ở đầu, tìm nhanh bằng Ctrl K, nhóm gập lại được, nút Tạo Tour luôn ở dưới.',
  d: 'Hai chế độ làm việc: Vận hành (trong ngày, điều hành) và Chuẩn bị (Tour, đăng ký, danh mục). Lịch sử luôn ghim ở dưới.',
};
let opt = 'a';
function render() {
  ({ a: renderA, b: renderB, c: renderC, d: renderD })[opt]();
  document.querySelectorAll('.sb').forEach((s) => { s.hidden = s.id !== 'sb-' + opt; });
  document.getElementById('note').textContent = NOTES[opt];
  const [name, , path] = P[cur];
  document.getElementById('crumb').textContent = path;
  document.getElementById('title').textContent = name;
  document.getElementById('hint').textContent = 'Nội dung trang giữ nguyên như hiện tại. Bản này chỉ thay đổi sidebar.';
}
document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-o]'); if (o) { opt = o.dataset.o; document.querySelectorAll('[data-o]').forEach((b) => b.setAttribute('aria-pressed', b === o)); render(); return; }
  const p = e.target.closest('[data-p]'); if (p) { e.preventDefault(); cur = p.dataset.p; dom = domainOf(cur); const pd = DOMAINS.prep.pages.includes(cur); mode = pd ? 'prep' : cur === 'history' ? mode : 'run'; open[domainOf(cur)] = true; render(); return; }
  const d = e.target.closest('[data-d]'); if (d) { dom = d.dataset.d; render(); return; }
  const a = e.target.closest('[data-acc]'); if (a) { open[a.dataset.acc] = !open[a.dataset.acc]; render(); return; }
  const m = e.target.closest('[data-m]'); if (m) { mode = m.dataset.m; render(); }
});
render();
</script>
</body>
</html>
