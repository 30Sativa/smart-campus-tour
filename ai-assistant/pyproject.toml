[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-assistant"
version = "0.1.0"
description = "CampusTour DT-AMR private Student Q&A service (internal, backend-mediated)"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
