# ============================================================
# OpenOCD: ST-Link V2 -> STM32G431CBUx
# SWD da bat tay duoc, khong can connect-under-reset nua.
# Dung software reset (AIRCR.SYSRESETREQ) qua SWD.
# ============================================================

source [find interface/stlink-dap.cfg]

set WORKAREASIZE 0x8000
transport select "dapdirect_swd"

set CHIPNAME STM32G431CBUx
set BOARDNAME genericBoard

set ENABLE_LOW_POWER 1
set STOP_WATCHDOG 1

# Toc do SWD (kHz). Fail thi ha xuong 100.
set CLOCK_FREQ 950

# --- Reset: software reset, khong ghim chan NRST ---
reset_config none separate
set CONNECT_UNDER_RESET 0
set CORE_RESET 0

set AP_NUM 0
set GDB_PORT 3333

source [find target/stm32g4x.cfg]

# Reset bang lenh qua SWD thay vi keo chan NRST
cortex_m reset_config sysresetreq
