# pose_bootstrap settings for map2.yaml (robot/docs/auto-initial-pose.md).
# The map YAML is not edited: fleet_bridge compares its bytes with the uploaded map package.
map_yaml: map2.yaml
frame_id: map
# Places the robot is usually switched on at; looked at first (+-0.6 m, +-25 deg around each).
homes:
  - poi_file: poi_start.yaml
  - poi_file: poi_01.yaml
# Also look around the last pose this robot saved on this map (always re-checked by the scan).
saved_pose: true
# When nothing above matches (robot pushed while off): search these boxes only. The whole
# building map has look-alike corridors (offline 13/11: a place 70 m away out-scored START).
# Box = start hall, x-corridor and the POI_01 y-corridor.
global_search:
  enabled: true
  regions:
    - [-3.0, -3.0, 12.0, 10.0]
search:
  min_score: 0.55
  ambiguity_margin: 0.08
