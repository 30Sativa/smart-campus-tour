# Compose development/reference environments: debug and standalone sim.
# Gazebo + backend SimulationPreview integration has its own
# docker-compose.preview.yml and is not a physical robot deployment path.
#
# MỌI service đều nằm sau một profile, nên `docker compose up` trần sẽ KHÔNG
# khởi động gì cả. Đó là chủ ý: trên laptop không thể vô tình start service
# hardware và gặp lỗi "/dev/ttyACM0: no such file or directory".
#
#   Ubuntu laptop (debug) : docker compose --profile debug up -d --build
#   Ubuntu laptop (sim)   : docker compose --profile sim   up -d --build
#
# Physical hardware is intentionally absent here. Native miniPC runtime uses
# robot/scripts/build-native and the launch files directly; this file is only
# for development/reference images and simulation.

x-ros2-common-env: &ros2-common-env
  # miniPC và laptop PHẢI dùng cùng domain. Hệ thống này dùng 30.
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-30}"
  RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
  ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY-0}"

services:
  # --------------------------------------------------------------- laptop --
  # Chỉ để development/debug + RViz2. KHÔNG có `devices:`, không chạy driver
  # phần cứng. Nhìn thấy topic của miniPC qua LAN nhờ network_mode: host.
  ros2-debug:
    profiles: [debug]
    build:
      context: .
      dockerfile: Dockerfile
      target: debug
    image: robot-ros2:debug
    container_name: ros2-debug
    network_mode: host
    restart: "no"
    environment:
      <<: *ros2-common-env
      ROS_DISCOVERY_SERVER:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      # Source mount live: sửa code trên laptop rồi colcon build trong container.
      - ./ros2_ws/src:/ros2_ws/src
      - ./robot_maps:/maps
      # X11 socket của Ubuntu host -> GUI hiện lên trên laptop.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    # Không launch gì cả. Vào container rồi tự chạy rviz2 / ros2 topic echo.
    #   docker exec -it ros2-debug bash
    #   rviz2
    command: >
      bash -c ': "$${ROS_DISCOVERY_SERVER:?ROS_DISCOVERY_SERVER must be set in .env}"; sleep infinity'

  # ----------------------------------------------------- laptop standalone --
  # Simulation độc lập với miniPC: DDS discovery local, không hardware devices.
  ros2-sim:
    profiles: [sim]
    build:
      context: .
      dockerfile: Dockerfile
      target: sim
    image: robot-ros2:sim
    container_name: ros2-sim
    network_mode: host
    restart: "no"
    environment:
      <<: *ros2-common-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - ./ros2_ws/src:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    command: >
      bash -c "sleep infinity"
