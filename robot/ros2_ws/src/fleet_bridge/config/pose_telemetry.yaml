# Real-robot pose telemetry -> backend (POST /api/robots/telemetry).
# The device secret is NOT here: export ROBOT_TELEMETRY_SECRET on the robot
# (docker compose env_file / .env, never committed). Its SHA-256 goes into
# Robots.CredentialHash (or RobotTelemetry:Robots in backend configuration).
pose_telemetry:
  ros__parameters:
    endpoint: http://127.0.0.1:5000/api/robots/telemetry
    robot_code: robot_01        # = Robots.RobotCode
    source: physical            # physical | gazebo | emulator, = Robots.SourceType
    map_key: campus_v1          # the saved map AMCL runs on (robot_maps/campus_map)
    global_frame: map
    base_frame: base_footprint
    amcl_topic: amcl_pose       # relative: /<robot_id>/amcl_pose under the robot namespace
    rate_hz: 5.0
    http_timeout: 1.0
    max_cov_xy: 0.25            # m^2; above this the web does not show the robot to students
    amcl_timeout: 5.0           # s without an AMCL update -> localized = false
    max_tf_age: 1.0             # s; older TF is not sent
