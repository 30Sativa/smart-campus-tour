/**:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    map_frame: map
    base_frame: base_footprint
    sample_period_sec: 0.2
    pose_stale_after_sec: 5.0
    report_period_sec: 2.0
    request_timeout_sec: 5.0
    max_report_age_sec: 30.0
    max_clock_floor_ahead_sec: 10.0
    retry_initial_sec: 1.0
    retry_max_sec: 30.0
    # Telemetry-only unless turned on. See README.md before enabling: never on a physical robot before M2.3.
    commands_enabled: false
    command_base_url: ""
    command_poll_period_sec: 0.5
    # ADR-0049. Used only with commands_enabled; mode_manager must then run with require_motion_permit: true.
    motion_permit_link_timeout_sec: 1.5
    motion_permit_period_sec: 0.2
    # ADR-0049 readiness, read only with commands_enabled. Copy map_key and the hash from the same MapVersion row.
    # report_period_sec must be below 2.0 with commands_enabled; the fleet command profile uses 0.5.
    readiness_odometry_topic: wheel/odom
    map_package_path: ""
    map_package_sha256: ""
    map_server_name: map_server
    localized_max_tf_age_sec: 1.0
    localized_max_xy_variance: 0.09
    localized_max_yaw_variance: 0.05
    motion_ready_max_odom_age_sec: 0.5
    # ADR-0045 Operator head buttons and the POI camera presets (docs/contracts/fleet-head/v1). Off by default;
    # needs stm32_bridge head/* in the same namespace and FleetHead:Enabled on the backend. While false, the head
    # never moves from the web and never turns at a POI (the node logs this at startup).
    head_enabled: false
    head_base_url: ""
    head_wait_ms: 1500
    # POI head (with head_enabled): the robot reads GET /api/fleet/head/v1/pois every head_poi_refresh_sec and,
    # from the navigate_to_pose goal status, turns the head to the front when a goal starts and to the POI's camera
    # preset when a goal succeeds within head_poi_radius_m of that POI. The backend's autoMotion can switch it off.
    head_poi_auto: true
    head_poi_radius_m: 0.6
    head_poi_refresh_sec: 5.0
    head_poi_nav_action: navigate_to_pose
    # Mini PC diagnostics report: CPU, RAM, disk, CPU temperature, sensor topic rates and the stm32_bridge
    # IMU diagnostic, sent to POST /api/fleet/v1/diagnostics. Observation only; never affects Fleet Sync.
    # Topics resolve inside robot_namespace; set one to "" for a sensor this robot does not have.
    diagnostics_enabled: true
    diagnostics_url: ""
    diagnostics_period_sec: 10.0
    diagnostics_disk_path: /
    diagnostics_stale_after_sec: 3.0
    diagnostics_lidar_topic: scan
    diagnostics_odometry_topic: wheel/odom
    diagnostics_imu_topic: imu/data
    diagnostics_depth_topic: camera/depth/points
