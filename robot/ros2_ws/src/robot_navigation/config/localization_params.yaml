# =============================================================================
# localization_params.yaml — map_server + AMCL on a saved map (ROS 2 Humble).
#
# Used by localization.launch.py. The map file itself is NOT set here; it is
# passed at launch time via the `map` launch argument (yaml_filename override).
#
# Frames/topics match the rest of the stack:
#   map -> odom (published by AMCL)  |  base: base_footprint  |  scan: /scan
# =============================================================================
/**/amcl:
  ros__parameters:
    use_sim_time: false

    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: scan

    # Motion model: differential drive (STM32 diff drive base).
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Odom noise. Increase alpha1/alpha2 if wheel odom slips a lot.
    alpha1: 0.2   # rot noise from rot
    alpha2: 0.2   # rot noise from trans
    alpha3: 0.2   # trans noise from trans
    alpha4: 0.2   # trans noise from rot
    alpha5: 0.2

    # Laser model: RPLiDAR A3M1 (25 m white / ~10 m dark objects).
    # Keep in sync with nav2_params.yaml costmaps.
    laser_model_type: "likelihood_field"
    laser_max_range: 15.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Particle filter.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.25   # m of travel before filter update
    update_min_a: 0.2    # rad of rotation before filter update
    recovery_alpha_slow: 0.001  # >0 enables recovery re-seeding when lost
    recovery_alpha_fast: 0.1

    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # INITIAL POSE - real robot must NOT auto-assume (0, 0, 0).
    #
    # A map origin of [0, 0, 0] in the .yaml only states where the bottom-left
    # corner of the PGM sits in the map frame. It says nothing about where the
    # robot is standing. Seeding AMCL at (0, 0, 0) when the robot is somewhere
    # else gives you a confidently wrong map -> odom transform: the particle
    # cloud looks tight, RViz looks plausible, and the robot drives into a
    # wall that is 4 m from where it thinks it is.
    #
    # So: false. The real robot waits for an initial pose on
    #   <robot_ns>/initialpose        (frame_id MUST be "map")
    # published by RViz "2D Pose Estimate", or by a dock/homing routine once
    # one exists.
    #
    # localization.launch.py exposes set_initial_pose:=true for Gazebo, where
    # the robot really does spawn at the world origin the sim map was recorded
    # from. sim_navigation.launch.py passes it.
    #
    # Sending an initial pose is NOT the same as being localized. Always
    # verify on the real robot that the laser scan overlays the saved walls
    # and that map -> odom stays stable while driving and rotating.
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

/**/map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden by the `map` launch argument in localization.launch.py.
    yaml_filename: ""
