/**/ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # robot_localization field order (15 booleans):
    # x, y, z, roll, pitch, yaw,
    # vx, vy, vz, vroll, vpitch, vyaw,
    # ax, ay, az.
    # STEP counts provide forward and differential wheel velocity only. Wheel
    # pose is an integration of the same measurements, so it is not fused too.
    odom0: wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom0_nodelay: true

    # Firmware exposes BNO085 Rotation Vector orientation but no raw gyro or
    # acceleration. Fuse yaw only. Relative mode makes the first valid yaw the
    # odom heading reference instead of snapping startup to magnetic north.
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: true
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: false
