/**/mode_manager_node:
  ros__parameters:
    initial_mode: manual
    manual_timeout: 0.5
    nav_timeout: 0.5
    output_rate_hz: 20.0
    manual_priority_in_explore: true
    cancel_nav2_on_manual: true
    nav2_cancel_service: navigate_to_pose/_action/cancel_goal
    # ADR-0049. Must be true whenever fleet_bridge has commands_enabled: true.
    require_motion_permit: false
    motion_permit_timeout: 0.6
    # Overridden to true by manual_mode.launch.py, which runs the real bridge.
    require_stm32_link: false
    stm32_link_timeout: 0.6
    nav2_status_topic: navigate_to_pose/_action/status
