# EXPERIMENT ONLY -- not the default. The default is ekf.yaml.
#
# Identical to ekf.yaml except that imu0 is removed, so heading comes only
# from integrating the wheel vyaw. Used to test whether the BNO085 Rotation
# Vector yaw (magnetometer-referenced) rotates odom away from the wheel/AMCL
# heading. The STM32 bridge still publishes imu/data; only the EKF ignores it.
#
# Select with:  ekf_params_file:=<share>/robot_control/config/ekf_wheel_only.yaml
# Roll back by omitting ekf_params_file (the launch default is ekf.yaml).
# test_ekf_contract.py keeps every other key equal to ekf.yaml.
/**/ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # robot_localization field order (15 booleans):
    # x, y, z, roll, pitch, yaw,
    # vx, vy, vz, vroll, vpitch, vyaw,
    # ax, ay, az.
    # STEP counts provide forward and differential wheel velocity. Fuse the
    # published vy=0 constraint because this is a nonholonomic diff-drive base.
    # Wheel pose is an integration of the same measurements, so it is not fused.
    odom0: wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom0_nodelay: true
