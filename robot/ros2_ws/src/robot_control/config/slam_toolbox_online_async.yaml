/**/slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: scan

    resolution: 0.05
    min_laser_range: 0.2
    # Khop voi upper_threshold trong scan_range_filter.yaml (25.0). Filter do
    # chay TRUOC va la cho quyet dinh thuc su -- neu no cat o 12 m thi de bao
    # nhieu o day cung vo nghia. Hai gia tri PHAI di cung nhau.
    # Luu y: AMCL dang de laser_max_range 15.0 (robot_navigation/config/
    # localization_params.yaml) -- lech voi cho nay, dong bo khi vao localization.
    max_laser_range: 25.0
    minimum_time_interval: 0.2
    # 0.2 s qua chat cho miniPC i3-7100T: khi CPU day tai, tra TF
    # odom->base_footprint tre hon nguong nay -> scan bi chen vao pose
    # ngoai suy sai -> map quet loan. Do bang: ros2 run tf2_ros tf2_monitor
    # odom base_footprint (xem Max Delay).
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    map_update_interval: 2.0
    throttle_scans: 1
    transform_publish_period: 0.02
    map_start_at_dock: false

    use_scan_matching: true
    use_scan_barycenter: true
    # 0.10 chen node moi 10 cm -> toa nha 30 m thanh pose graph khong lo, ma
    # ceres chay tren Pentium Silver J5005 thi khong toi uu kip, loop closure
    # bi tre hoac bo han. 0.25 giam ~2.5 lan so node, chat luong map gan nhu
    # khong doi. Ha lai ve 0.10-0.15 neu map phong nho can chi tiet.
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.10
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # LOOP CLOSURE -- khep vong khi quay lai cho cu, xoa sach phan odom da troi.
    #
    # loop_search_maximum_distance = ban kinh xet node cu lam ung vien loop.
    # Mac dinh goc cua slam_toolbox la 3.0, tune cho robot co encoder that trong
    # khong gian vua. Xe nay dung dem xung stepper ho mach trong toa nha ~30 m,
    # nen do troi luc quay ve vuot xa 3 m -> node cua diem xuat phat nam NGOAI
    # ban kinh -> slam_toolbox khong he TIM, chu khong phai tim ma khong thay.
    # Do duoc 10/09/2026: quay ve diem A ma pose nhay sang B, cach ~24 m.
    loop_search_maximum_distance: 15.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    # Noi ban kinh tim thi PHAI siet nguong khop, neu khong de an false loop
    # closure: hanh lang campus lap lai rat giong nhau, khop nham doan nay voi
    # doan khac se giat lech toan bo graph. Hai gia tri nay len cung luc voi
    # loop_search_maximum_distance, dung sua rieng le.
    loop_match_minimum_response_coarse: 0.40
    loop_match_minimum_response_fine: 0.50

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Cua so do khop cua loop closure (m). Phai du lon de phu noi do troi, neu
    # khong thi tim dung ung vien ma van khong khop duoc. Len cung voi
    # loop_search_maximum_distance.
    loop_search_space_dimension: 15.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
