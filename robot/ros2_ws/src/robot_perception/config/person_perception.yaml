# Phase 4 person perception. Every number here should be a measured one.
/**/person_perception:
  ros__parameters:
    # Absolute path to the exported OpenVINO IR. Export on a laptop:
    # Export YOLO26n on a development machine; record the artifact/runtime hash.
    model_xml: ""
    device: "CPU"            # try "GPU" once; HD 630 is Gen9.5 and often fails
    imgsz: 320
    inference_threads: 2     # of 4. Leave the rest to nav2_controller.
    conf_threshold: 0.45
    iou_threshold: 0.5
    rate_hz: 5.0             # raise only if bench_detector.py says there is room

    camera_name: "camera"
    base_frame: "base_link"
    stale_after_s: 1.0
    future_stamp_tolerance_s: 0.05

    bbox_only: false
    publish_speed_limit: false
    slow_speed_percent: 50.0
    slow_enter_x_m: 2.0
    slow_exit_x_m: 2.5
    corridor_half_width_m: 0.8
    clear_hold_s: 1.0
    clear_max_gap_s: 0.4
    report_period: 5.0
