name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Successful main commit SHA from Backend Verify
        required: true
        type: string

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected backend release through SSM
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      OPS_SHA: ${{ github.sha }}

    steps:
      - name: Validate application and operations revisions
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_sha must be a 40-character lowercase commit SHA.' >&2
            exit 1
          }
          [[ "$OPS_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'The operations commit must be a 40-character lowercase commit SHA.' >&2
            exit 1
          }
          response=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/backend-verify.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=100")
          run_id=$(jq -r --arg sha "$RELEASE_SHA" '
            [.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_sha == $sha and .conclusion == "success")]
            | sort_by(.run_number) | last | .id // empty
          ' <<<"$response")
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo 'No successful main Backend Verify run exists for this SHA.' >&2
            exit 1
          }
          ops_response=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/backend-verify.yml/runs?head_sha=$OPS_SHA&status=success&per_page=100")
          ops_run_id=$(jq -r --arg sha "$OPS_SHA" '
            [.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_sha == $sha and .conclusion == "success")]
            | sort_by(.run_number) | last | .id // empty
          ' <<<"$ops_response")
          [[ "$ops_run_id" =~ ^[0-9]+$ ]] || {
            echo 'The operations commit has no successful main Backend Verify run.' >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the immutable release manifest
        uses: actions/download-artifact@v4
        with:
          name: backend-release-${{ inputs.release_sha }}
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/backend-release

      - name: Validate pinned image references
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/backend-release/backend-release.json"
          [[ -s "$manifest" ]]
          python3 backend/deploy/validate-release-manifest.py "$manifest" "$RELEASE_SHA" "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment to the selected EC2 instance through SSM
        id: ssm
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          API_IMAGE: ${{ steps.manifest.outputs.api_image }}
          DB_INIT_IMAGE: ${{ steps.manifest.outputs.db_init_image }}
          SQLSERVER_IMAGE: ${{ steps.manifest.outputs.sqlserver_image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || {
            echo 'EC2_INSTANCE_ID is missing or malformed.' >&2
            exit 1
          }
          [[ "$OPS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Operations commit must be a 40-character SHA.' >&2; exit 1; }
          installer_url="https://raw.githubusercontent.com/30Sativa/smart-campus-tour/$OPS_SHA/backend/deploy/install-host-tools.sh"
          script_url="https://raw.githubusercontent.com/30Sativa/smart-campus-tour/$OPS_SHA/backend/deploy/deploy-ec2.sh"
          printf -v remote_command 'set -eu; installer=$(mktemp); script=$(mktemp); trap '\''rm -f "$installer" "$script"'\'' 0; curl --fail --location --silent --show-error --max-time 45 %q -o "$installer"; chmod 0700 "$installer"; bash "$installer" %q; curl --fail --location --silent --show-error --max-time 45 %q -o "$script"; chmod 0700 "$script"; bash "$script" %q %q %q %q %q' \
            "$installer_url" "$OPS_SHA" "$script_url" "$RELEASE_SHA" "$API_IMAGE" "$DB_INIT_IMAGE" "$SQLSERVER_IMAGE" "$OPS_SHA"
          jq -n --arg command "$remote_command" '{commands:[$command],executionTimeout:["1800"]}' > "$RUNNER_TEMP/ssm-parameters.json"
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "CampusTour backend release $RELEASE_SHA" \
            --timeout-seconds 120 \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]] || { echo 'SSM did not return a command ID.' >&2; exit 1; }
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command $command_id sent to $EC2_INSTANCE_ID."

      - name: Wait for SSM deployment and report its result
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          status=Pending
          for attempt in $(seq 1 210); do
            result=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --output json 2>/dev/null || true)
            if [[ -n "$result" ]]; then
              status=$(jq -r '.Status // "Pending"' <<<"$result")
              case "$status" in
                Success|Cancelled|TimedOut|Failed|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                  jq -r '.StandardOutputContent // empty' <<<"$result"
                  stderr=$(jq -r '.StandardErrorContent // empty' <<<"$result")
                  if [[ -n "$stderr" ]]; then printf 'SSM stderr:\n%s\n' "$stderr" >&2; fi
                  [[ "$status" == Success ]] || { echo "SSM deployment finished with status $status." >&2; exit 1; }
                  echo 'PASS: SSM deployment command succeeded.'
                  exit 0
                  ;;
              esac
            fi
            sleep 10
          done
          echo "SSM deployment did not finish within 35 minutes (last status: $status)." >&2
          exit 1
