name: AI Assistant Deploy

# Builds the ai-assistant image and starts it on the backend EC2 host next to the API
# (ai-assistant/deploy/README.md). Only a successful main push of AI Assistant Verify,
# or a manual run on main, reaches the production environment credentials.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [AI Assistant Verify]
    types: [completed]
    branches: [main]

concurrency:
  group: ai-assistant-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and deploy ai-assistant over SSH
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ai-assistant
          file: ./ai-assistant/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/30sativa/smart-campus-tour/ai-assistant:${{ env.RELEASE_SHA }}

      - name: Deploy the image digest over pinned SSH
        env:
          IMAGE: ghcr.io/30sativa/smart-campus-tour/ai-assistant@${{ steps.build.outputs.digest }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/deploy-key"
          export DEPLOY_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/deploy-known-hosts"
          trap 'rm -f -- "$DEPLOY_SSH_KEY_FILE" "$DEPLOY_SSH_KNOWN_HOSTS_FILE"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$DEPLOY_SSH_KNOWN_HOSTS_FILE"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          bash ai-assistant/deploy/ssh-deploy.sh "$IMAGE"
          echo "Deployed $IMAGE for $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
