name: Build STM32 Firmware

on:
  pull_request:
    paths:
      - "robot/firmware/stm32/**"
      - ".github/workflows/stm32-build.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "robot/firmware/stm32/**"
      - ".github/workflows/stm32-build.yml"
  workflow_dispatch:

jobs:
  build-stm32:
    name: Compile STM32 firmware only
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: robot/firmware/stm32/motor_controller

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi make

      - name: Compile firmware and generate artifacts
        run: |
          make clean
          make -j"$(nproc)" all

      - name: Upload firmware build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-motor-controller
          path: |
            robot/firmware/stm32/motor_controller/build/MotorController_G431.elf
            robot/firmware/stm32/motor_controller/build/MotorController_G431.bin
            robot/firmware/stm32/motor_controller/build/MotorController_G431.hex
            robot/firmware/stm32/motor_controller/build/MotorController_G431.map
            robot/firmware/stm32/motor_controller/build/MotorController_G431.list
          if-no-files-found: error
