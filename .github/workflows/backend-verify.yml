name: Backend Verify

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/architecture.md"
      - "docs/decisions/**"
      - ".github/workflows/backend-verify.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "docs/architecture.md"
      - "docs/decisions/**"
      - ".github/workflows/backend-verify.yml"

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CI-only-Sql-Password-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd='/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "CI-only-Sql-Password-2026!" -C -Q "SELECT 1" -b'
          --health-interval=10s --health-timeout=5s --health-retries=12 --health-start-period=30s
    env:
      SMARTCAMPUS_REQUIRE_SQL_TESTS: "true"
      SMARTCAMPUS_SCHEMA_TEST_CONNECTION: "Server=localhost,1433;Database=master;User ID=sa;Password=CI-only-Sql-Password-2026!;Encrypt=True;TrustServerCertificate=True;Connect Timeout=15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run backend verification
        run: bash backend/scripts/verify
