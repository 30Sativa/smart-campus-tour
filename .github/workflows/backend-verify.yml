name: Backend Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: backend-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      release_needed: ${{ steps.detect.outputs.release_needed }}
      database_tool_changed: ${{ steps.detect.outputs.database_tool_changed }}
      cache_test_needed: ${{ steps.detect.outputs.cache_test_needed }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify backend change scope
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA^" 2>/dev/null || printf '%040d' 0)
          fi
          if [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo 'backend_changed=true' >> "$GITHUB_OUTPUT"
            echo 'release_needed=true' >> "$GITHUB_OUTPUT"
            echo 'database_tool_changed=true' >> "$GITHUB_OUTPUT"
            echo 'cache_test_needed=true' >> "$GITHUB_OUTPUT"
          else
            bash backend/scripts/detect-ci-changes.sh "$BASE_SHA" "$HEAD_SHA"
          fi

  verify:
    name: Verify backend
    needs: changes
    if: needs.changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Aa1!CI-${{ github.run_id }}-Run-${{ github.run_attempt }}"
        ports:
          - 1433:1433
    env:
      SMARTCAMPUS_REQUIRE_SQL_TESTS: "true"
      SMARTCAMPUS_SCHEMA_TEST_CONNECTION: "Server=localhost,1433;Database=master;User ID=sa;Password=Aa1!CI-${{ github.run_id }}-Run-${{ github.run_attempt }};Encrypt=True;TrustServerCertificate=True;Connect Timeout=15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for SQL Server readiness
        env:
          SQLSERVER_CONTAINER_ID: ${{ job.services.sqlserver.id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if docker exec "$SQLSERVER_CONTAINER_ID" /bin/bash -c \
              'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null'; then
              echo "SQL Server answered SELECT 1."
              exit 0
            fi
            state=$(docker inspect --format '{{.State.Status}}' "$SQLSERVER_CONTAINER_ID" 2>/dev/null || true)
            [[ "$state" == running ]] || break
            sleep 3
          done
          echo "SQL Server failed readiness: expected SELECT 1 within 120 seconds." >&2
          docker inspect --format 'container={{.State.Status}} exit={{.State.ExitCode}}' "$SQLSERVER_CONTAINER_ID" || true
          docker logs --tail 120 "$SQLSERVER_CONTAINER_ID" || true
          exit 1

      - name: Set up .NET 10 with NuGet cache
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Run backend verification
        env:
          SMARTCAMPUS_TEST_RESULTS_DIR: ${{ runner.temp }}/backend-test-results
        run: bash backend/scripts/verify

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-test-results
          if-no-files-found: warn
          retention-days: 7

  image-pr:
    name: Build and smoke-test backend PR images
    if: github.event_name == 'pull_request' && needs.changes.outputs.release_needed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry for the pinned DB tool
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pinned base images
        id: bases
        shell: bash
        run: bash backend/scripts/resolve-base-images "$GITHUB_OUTPUT"
      - name: Check Docker cache portability when build inputs change
        if: needs.changes.outputs.cache_test_needed == 'true'
        env:
          SDK_IMAGE: ${{ steps.bases.outputs.sdk }}
        run: bash backend/scripts/test-docker-build-cache
      - name: Build API image candidate
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: campustour-backend:pr-${{ github.event.pull_request.number }}
          build-args: |
            SDK_IMAGE=${{ steps.bases.outputs.sdk }}
            RUNTIME_IMAGE=${{ steps.bases.outputs.runtime }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,mode=max,scope=backend-api
      - name: Build DB tool candidate when database inputs changed
        if: needs.changes.outputs.database_tool_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.db-init
          platforms: linux/amd64
          load: true
          tags: campustour-db-init:pr-${{ github.event.pull_request.number }}
          build-args: |
            SQLSERVER_IMAGE=${{ steps.bases.outputs.sql }}
            VCS_REF=${{ github.sha }}
            VERSION=1.4
            BUILD_DATE=${{ github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=backend-db-init
          cache-to: type=gha,mode=max,scope=backend-db-init
      - name: Reuse the last verified DB tool when its inputs are unchanged
        if: needs.changes.outputs.database_tool_changed != 'true'
        run: docker pull ghcr.io/30sativa/smart-campus-tour/backend-db-init:schema-v1.4
      - name: Smoke-test PR API with exact candidate and database tool images
        env:
          BACKEND_IMAGE: campustour-backend:pr-${{ github.event.pull_request.number }}
          DB_INIT_IMAGE: ${{ needs.changes.outputs.database_tool_changed == 'true' && format('campustour-db-init:pr-{0}', github.event.pull_request.number) || 'ghcr.io/30sativa/smart-campus-tour/backend-db-init:schema-v1.4' }}
          SQLSERVER_IMAGE: ${{ steps.bases.outputs.sql }}
          DEPLOYMENT_TEST_BUILD_IMAGES: "false"
        run: bash backend/scripts/test-deployment

  image-main:
    name: Publish and smoke-test backend candidate images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release_needed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.release.outputs.api_image }}
      db_init_image: ${{ steps.release.outputs.db_init_image }}
      db_init_source_sha: ${{ steps.release.outputs.db_init_source_sha }}
      database_schema_version: ${{ steps.release.outputs.database_schema_version }}
      sqlserver_image: ${{ steps.release.outputs.sqlserver_image }}
      sdk_image: ${{ steps.release.outputs.sdk_image }}
      runtime_image: ${{ steps.release.outputs.runtime_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pinned SDK, runtime, and SQL base digests
        id: bases
        shell: bash
        run: bash backend/scripts/resolve-base-images "$GITHUB_OUTPUT"
      - name: Check Docker cache portability when build inputs change
        if: needs.changes.outputs.cache_test_needed == 'true'
        env:
          SDK_IMAGE: ${{ steps.bases.outputs.sdk }}
        run: bash backend/scripts/test-docker-build-cache
      - name: Build and publish API candidate image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/30sativa/smart-campus-tour/backend:${{ github.sha }}
          build-args: |
            SDK_IMAGE=${{ steps.bases.outputs.sdk }}
            RUNTIME_IMAGE=${{ steps.bases.outputs.runtime }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,mode=max,scope=backend-api
          sbom: true
          provenance: mode=max
      - name: Build and publish versioned DB tool candidate when inputs changed
        id: dbnew
        if: needs.changes.outputs.database_tool_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.db-init
          platforms: linux/amd64
          push: true
          tags: ghcr.io/30sativa/smart-campus-tour/backend-db-init:${{ github.sha }}
          build-args: |
            SQLSERVER_IMAGE=${{ steps.bases.outputs.sql }}
            VCS_REF=${{ github.sha }}
            VERSION=1.4
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=backend-db-init
          cache-to: type=gha,mode=max,scope=backend-db-init
          sbom: true
          provenance: mode=max
      - name: Resolve the immutable DB tool artifact
        id: dbartifact
        shell: bash
        env:
          DB_CHANGED: ${{ needs.changes.outputs.database_tool_changed }}
          NEW_DB_DIGEST: ${{ steps.dbnew.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DB_CHANGED" == true ]]; then
            [[ "$NEW_DB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            db_image="ghcr.io/30sativa/smart-campus-tour/backend-db-init@$NEW_DB_DIGEST"
            db_source="$SOURCE_SHA"
          else
            db_tag=ghcr.io/30sativa/smart-campus-tour/backend-db-init:schema-v1.4
            docker pull "$db_tag"
            db_image=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$db_tag" | grep -E '^ghcr\.io/30sativa/smart-campus-tour/backend-db-init@sha256:[0-9a-f]{64}$' | head -n1)
            db_source=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$db_tag")
          fi
          docker pull "$db_image"
          tool_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$db_image")
          schema_version=$(docker image inspect --format '{{index .Config.Labels "org.smartcampus.database.schema-version"}}' "$db_image")
          [[ "$tool_revision" == "$db_source" && "$schema_version" == 1.4 ]]
          echo "db_image=$db_image" >> "$GITHUB_OUTPUT"
          echo "db_source=$db_source" >> "$GITHUB_OUTPUT"
      - name: Pull and validate exact API and DB tool artifacts
        env:
          API_IMAGE: ghcr.io/30sativa/smart-campus-tour/backend@${{ steps.api.outputs.digest }}
          DB_INIT_IMAGE: ${{ steps.dbartifact.outputs.db_image }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$API_IMAGE"
          [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$API_IMAGE") == "$SOURCE_SHA" ]]
          [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$DB_INIT_IMAGE") == "${{ steps.dbartifact.outputs.db_source }}" ]]
          [[ $(docker image inspect --format '{{index .Config.Labels "org.smartcampus.database.schema-version"}}' "$DB_INIT_IMAGE") == 1.4 ]]
      - name: Smoke-test exact published candidate images
        env:
          BACKEND_IMAGE: ghcr.io/30sativa/smart-campus-tour/backend@${{ steps.api.outputs.digest }}
          DB_INIT_IMAGE: ${{ steps.dbartifact.outputs.db_image }}
          SQLSERVER_IMAGE: ${{ steps.bases.outputs.sql }}
          DEPLOYMENT_TEST_BUILD_IMAGES: "false"
        run: bash backend/scripts/test-deployment
      - name: Publish manifest inputs for final gate
        id: release
        env:
          API_IMAGE: ghcr.io/30sativa/smart-campus-tour/backend@${{ steps.api.outputs.digest }}
          DB_INIT_IMAGE: ${{ steps.dbartifact.outputs.db_image }}
          DB_SOURCE_SHA: ${{ steps.dbartifact.outputs.db_source }}
          SDK_IMAGE: ${{ steps.bases.outputs.sdk }}
          RUNTIME_IMAGE: ${{ steps.bases.outputs.runtime }}
          SQLSERVER_IMAGE: ${{ steps.bases.outputs.sql }}
        run: |
          {
            echo "api_image=$API_IMAGE"
            echo "db_init_image=$DB_INIT_IMAGE"
            echo "db_init_source_sha=$DB_SOURCE_SHA"
            echo "database_schema_version=1.4"
            echo "sdk_image=$SDK_IMAGE"
            echo "runtime_image=$RUNTIME_IMAGE"
            echo "sqlserver_image=$SQLSERVER_IMAGE"
          } >> "$GITHUB_OUTPUT"

  release-manifest:
    name: Finalize verified backend release manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release_needed == 'true'
    needs: [changes, verify, image-main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote DB tool tag only after all gates pass
        if: needs.changes.outputs.database_tool_changed == 'true'
        env:
          DB_IMAGE: ${{ needs.image-main.outputs.db_init_image }}
        run: docker buildx imagetools create --tag ghcr.io/30sativa/smart-campus-tour/backend-db-init:schema-v1.4 "$DB_IMAGE"
      - name: Write immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs.image-main.outputs.api_image }}
          DB_INIT_IMAGE: ${{ needs.image-main.outputs.db_init_image }}
          DB_INIT_SOURCE_SHA: ${{ needs.image-main.outputs.db_init_source_sha }}
          DATABASE_SCHEMA_VERSION: ${{ needs.image-main.outputs.database_schema_version }}
          SDK_IMAGE: ${{ needs.image-main.outputs.sdk_image }}
          RUNTIME_IMAGE: ${{ needs.image-main.outputs.runtime_image }}
          SQLSERVER_IMAGE: ${{ needs.image-main.outputs.sqlserver_image }}
        run: |
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg api_image "$API_IMAGE" \
            --arg db_init_image "$DB_INIT_IMAGE" \
            --arg db_init_source_sha "$DB_INIT_SOURCE_SHA" \
            --arg database_schema_version "$DATABASE_SCHEMA_VERSION" \
            --arg sdk_image "$SDK_IMAGE" \
            --arg runtime_image "$RUNTIME_IMAGE" \
            --arg sqlserver_image "$SQLSERVER_IMAGE" \
            '{format_version:2,source_sha:$source_sha,api_image:$api_image,db_init_image:$db_init_image,db_init_source_sha:$db_init_source_sha,database_schema_version:$database_schema_version,sdk_image:$sdk_image,runtime_image:$runtime_image,sqlserver_image:$sqlserver_image}' \
            > "$RUNNER_TEMP/backend-release.json"
          python3 backend/deploy/validate-release-manifest.py "$RUNNER_TEMP/backend-release.json" "$SOURCE_SHA" /dev/null
      - name: Save verified release manifest
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ github.sha }}
          path: ${{ runner.temp }}/backend-release.json
          if-no-files-found: error
          retention-days: 90
