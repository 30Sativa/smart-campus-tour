name: Web E2E screenshots

# Screenshot smoke run of the web app (web/e2e, Playwright). Every backend call is
# answered by route mocks in web/e2e/fixtures; nothing reaches a real API.
# The screenshots (375/800/1366 px) and the HTML report are uploaded as the
# `e2e-screenshots` artifact, also when a check fails, as visual evidence for PRs.

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-e2e.yml"

jobs:
  e2e:
    name: Web E2E screenshots
    runs-on: ubuntu-24.04  # Playwright 1.60 has no Chromium build for ubuntu-latest (26.04)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/e2e-results/
          if-no-files-found: warn
          retention-days: 14
