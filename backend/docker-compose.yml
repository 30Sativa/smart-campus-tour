name: ${COMPOSE_PROJECT_NAME:-campustour}

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04}
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in backend/.env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - sqlserver-data:/var/opt/mssql
      - type: bind
        source: ${SQL_BACKUP_DIR:?Set SQL_BACKUP_DIR in backend/.env}
        target: /var/opt/mssql/backup
        bind:
          create_host_path: false
    networks: [database]
    # Database traffic stays inside Docker. No host/public port 1433.
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 12
    # Candidate limits for a 4 GiB host; measure on EC2 before accepting them.
    mem_limit: ${SQLSERVER_MEMORY_LIMIT:-2560m}
    cpus: ${SQLSERVER_CPUS:-1.25}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging

  db-init:
    image: ${DB_INIT_IMAGE:?Set DB_INIT_IMAGE to the release's pinned initializer image}
    platform: linux/amd64
    environment:
      SQLCMDPASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in backend/.env}
      SQL_APP_PASSWORD: ${SQL_APP_PASSWORD:?Set SQL_APP_PASSWORD in backend/.env}
    networks: [database]
    depends_on:
      sqlserver:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${DB_INIT_MEMORY_LIMIT:-192m}
    cpus: ${DB_INIT_CPUS:-0.25}
    restart: "no"
    logging: *logging

  api:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the release's immutable API image}
    platform: linux/amd64
    env_file:
      - ${API_ENV_FILE:-./deploy/api.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/tls/fullchain.pem
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /run/tls/privkey.pem
      AllowedHosts: "${API_HOST:?Set API_HOST in backend/.env};localhost"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SmartCampusTourV11;User ID=smartcampus_api;Password=${SQL_APP_PASSWORD:?Set SQL_APP_PASSWORD in backend/.env};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in backend/.env}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:?Set WEB_ORIGIN in backend/.env}
      SimulationPreview__Enabled: "false"
    volumes:
      - type: bind
        source: ${TLS_CERT_PATH:?Set TLS_CERT_PATH in backend/.env}
        target: /run/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_PATH:?Set TLS_KEY_PATH in backend/.env}
        target: /run/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [database, outbound]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    cpus: ${API_CPUS:-0.75}
    init: true
    logging: *logging
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${API_BIND_IP:-0.0.0.0}:${API_HTTPS_PORT:-443}:8443"
    healthcheck:
      test: [CMD-SHELL, 'curl --silent --show-error --insecure --max-time 5 --output /dev/null --fail https://localhost:8443/health/ready']
      interval: 15s
      timeout: 6s
      start_period: 45s
      retries: 3
    restart: unless-stopped

  seed-admin:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the release's immutable API image}
    platform: linux/amd64
    profiles: [tools]
    command: [--seed-initial-admin]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SmartCampusTourV11;User ID=smartcampus_api;Password=${SQL_APP_PASSWORD:?Set SQL_APP_PASSWORD in backend/.env};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
      InitialAdminSeed__Username: ${INITIAL_ADMIN_USERNAME:-}
      InitialAdminSeed__Password: ${INITIAL_ADMIN_PASSWORD:-}
      InitialAdminSeed__FullName: ${INITIAL_ADMIN_FULL_NAME:-}
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.25
    init: true
    logging: *logging
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  sqlserver-data:

networks:
  database:
    internal: true
  outbound:
