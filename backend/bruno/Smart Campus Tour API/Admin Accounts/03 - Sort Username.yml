info:
  name: 03 - Sort Username
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/admin/accounts?sort=username&page=1&size=20"
  params:
    - name: sort
      value: username
      type: query
    - name: page
      value: "1"
      type: query
    - name: size
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
