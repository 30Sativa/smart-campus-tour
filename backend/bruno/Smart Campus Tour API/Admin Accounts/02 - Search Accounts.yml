info:
  name: 02 - Search Accounts
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/admin/accounts?search=admin&page=1&size=20"
  params:
    - name: search
      value: admin
      type: query
    - name: page
      value: "1"
      type: query
    - name: size
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
