info:
  name: 06 - Create Staff
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/admin/accounts"
  body:
    type: json
    data: |-
      {
        "username": "{{staffUsername}}",
        "fullName": "Staff Demo",
        "role": "Staff",
        "initialPassword": "{{staffPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: staffUsername
      value: staff
    - name: staffPassword
      value: staff@1234

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
