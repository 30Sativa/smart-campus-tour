# Explicit opt-in only. API and SQL engine Compose contains no schema writer.
services:
  db-init:
    image: ${DB_INIT_IMAGE:?Set DB_INIT_IMAGE to the separately verified DB tool digest}
    platform: linux/amd64
    profiles: [db-bootstrap]
    command: [--check-only]
    environment:
      SQLCMDPASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in backend/.env}
      SQL_APP_PASSWORD: ${SQL_APP_PASSWORD:?Set SQL_APP_PASSWORD in backend/.env}
    networks: [database]
    labels:
      com.smartcampus.deployment.owner: ${COMPOSE_OWNER:?Set COMPOSE_OWNER to the host deployment owner ID}
    depends_on:
      sqlserver:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${DB_INIT_MEMORY_LIMIT:-192m}
    cpus: ${DB_INIT_CPUS:-0.25}
    restart: "no"
